nextest-version = "0.9.151"

[profile.ci]
fail-fast = false
retries = 0
failure-output = "immediate-final"

[profile.ci.junit]
path = "junit.xml"
store-success-output = false
store-failure-output = true

[profile.ci-endpoint-coverage-owner]
inherits = "ci"

[profile.ci-endpoint-coverage]
inherits = "ci"

[profile.ci-experimental-ssh]
inherits = "ci"

[profile.ci-experimental-wireguard]
inherits = "ci"
slow-timeout = { period = "30s", terminate-after = 2 }
global-timeout = "5m"

[profile.ci-experimental-sftp]
inherits = "ci"

[profile.ci-experimental-ssh-capture]
inherits = "ci"

[profile.ci-experimental-ssh-wireguard]
inherits = "ci"
test-threads = 2
slow-timeout = { period = "30s", terminate-after = 2 }
global-timeout = "5m"

[profile.ci-experimental-verified-prefix-resume]
inherits = "ci"
test-threads = 2
slow-timeout = { period = "30s", terminate-after = 2 }
global-timeout = "5m"

[profile.ci-experimental-linux-public-apply]
inherits = "ci"
slow-timeout = { period = "30s", terminate-after = 2 }
global-timeout = "5m"

[profile.ci-experimental-linux-public-command]
inherits = "ci"
slow-timeout = { period = "30s", terminate-after = 2 }
global-timeout = "5m"

[profile.ci-experimental-linux-managed-sync]
inherits = "ci"
slow-timeout = { period = "30s", terminate-after = 2 }
global-timeout = "5m"

[profile.ci-experimental-apfs-copy]
inherits = "ci"

[profile.ci-experimental-windows-bootstrap-inspect]
inherits = "ci"
slow-timeout = { period = "30s", terminate-after = 2 }
global-timeout = "5m"

[profile.ci-experimental-windows-capture-descriptor]
inherits = "ci"
slow-timeout = { period = "30s", terminate-after = 2 }
global-timeout = "5m"

[profile.ci-release]
inherits = "ci"
