schema_version = 1

# The locked graph identifies exact versions, parents, features, targets, licenses,
# and build-code exposure. These purposes explain why the graph inputs exist.
[purpose]
arrayvec = "BLAKE3's fixed-capacity tree and digest state."
bitflags = "Typed operating-system flags in rustix."
blake3 = "Source-stream and independent stage read-back digests, content bindings, and authenticated-record hashing."
block-buffer = "Fixed-size block buffering for the digest traits and SHA-512."
cc = "Compile BLAKE3's target-specific native implementation inputs."
cfg-if = "Select architecture and feature-specific implementations in the hash and signature stack."
constant_time_eq = "Fixed-length digest equality in BLAKE3."
cpufeatures = "Runtime architecture feature selection in BLAKE3, Curve25519, and SHA-2."
crc32c = "Detect torn or corrupt journal frames before authenticated record decoding."
crypto-common = "Common cryptographic traits, block widths, and output sizes for digest implementations."
curve25519-dalek = "Curve and scalar arithmetic backing Ed25519 signatures."
curve25519-dalek-derive = "Generate architecture-specialized Curve25519 code."
digest = "Cryptographic digest and block interfaces for Ed25519's uses of SHA-512."
ed25519 = "Representation and signature traits for Ed25519 signatures."
ed25519-dalek = "Sign and verify journal records and receipts."
errno = "Access native thread-local error codes in the rustix libc backend."
find-msvc-tools = "Locate the MSVC compiler and toolchain for cc."
generic-array = "Use type-level sizes for arrays in the digest stack."
itoa = "Format integer fields in CLI JSON output."
libc = "Expose macOS ABI types, flags, and functions needed by the native adapter and OS wrappers."
linux-raw-sys = "Provide Linux syscall ABI definitions for rustix."
memchr = "Byte search used by serde_json."
minicbor = "Read and write bounded, explicitly encoded journal records and receipts."
proc-macro2 = "Represent token streams for code generated by derive macros."
quote = "Construct Rust tokens for the desugared derive output."
rustc_version = "Detect compiler versions in CRC32C and Curve25519 build scripts."
rustix = "Capability-scoped filesystem operations and access to process and entropy facilities."
semver = "Parse compiler version requirements for build-time capability detection."
serde = "Describe stable CLI report field and enum names."
serde_core = "Serialization and deserialization traits shared by Serde and serde_json."
serde_derive = "Generate report serialization trait implementations at build time."
serde_json = "Serialize versioned CLI report values to JSON."
sha2 = "SHA-512 for Ed25519 signing and verification."
shlex = "Interpret compiler command and flag syntax used by cc."
signature = "Signature trait interface used by the Ed25519 signature representation."
subtle = "Constant-time selection and equality in the Ed25519 and Curve25519 stack."
syn = "Parse Rust input to signature-backend and report derive macros."
typenum = "Type-level arithmetic for digest sizes and fixed-array lengths."
unicode-ident = "Recognize Rust Unicode identifiers during macro expansion."
uuid = "Represent and encode fixed-size transaction identities."
version_check = "Detect compiler features for generic-array at build time."
zeroize = "Clear temporary copies of signing keys and cryptographic intermediate state."
zmij = "Format floating-point JSON values in serde_json's serializer."

[assessment."blake3@1.8.7"]
archive_sha256 = "6d9e454fc11f76977dc803893aff6304ed33d6a26efae8696573bea74baa27ae"
release_observation = "Local crates.io index lists 1.8.7 on 2026-08-20 after 1.8.6 on 2026-08-05."
security_history = "No package advisory in the recorded RustSec snapshot."
unsafe_exposure = "Native build.rs chooses SIMD inputs. src/platform.rs and src/ffi_* dispatch into target-specific implementations. Audit CPU detection and native code for each selected backend."
resource_limits = "Transfer callers stream fixed-size buffers. Hash state has bounded size and work grows with total accepted bytes."
adversarial_inputs = "Callers feed arbitrary file bytes and compare a separate stage read-back digest. The digest binding assumes collision resistance."
verification = "ExaCopy content-stream and transfer read-back tests cover the integration. Native SIMD implementations need separate source and baseline CPU evidence."
replacement = "Retain the BLAKE3 digest and exact byte encoding or migrate authenticated records and receipts through an explicit new format."
review_gaps = ["Selected native build and architecture-dispatch review", "Independent exact-version suitability evidence"]

[assessment."crc32c@0.6.9"]
archive_sha256 = "7f132a176423ee852e8f0a35d43088d1850966b50745be818a88b76f64b1c6cb"
release_observation = "Local crates.io index lists 0.6.9 on 2026-11-02 after 0.6.8 on 2024-06-09."
security_history = "No package advisory in the recorded RustSec snapshot."
unsafe_exposure = "src/hw_x86_64.rs, src/hw_aarch64.rs, and src/util.rs contain intrinsic and pointer paths. build.rs probes the compiler."
resource_limits = "Journal frame payloads are capped at 1 MiB before checksum processing. Work is linear in the bounded frame."
adversarial_inputs = "CRC detects incidental corruption. Independently validate frame structure and authenticate records before treating them as authority."
verification = "Journal tests and the journal-frame fuzz target exercise framing and damaged-input handling. CPU dispatch paths require separate qualification."
replacement = "A replacement must reproduce CRC32C parameters and existing frame vectors."
review_gaps = ["Hardware and software path suitability review", "Independent exact-version suitability evidence"]

