schema_version = 1

# The locked graph identifies exact versions, parents, features, targets, licenses,
# and build-code exposure. These purposes explain why the graph inputs exist.
[purpose]
arrayvec = "BLAKE3's fixed-capacity tree and digest state."
bitflags = "Typed operating-system flags in rustix."
blake3 = "Source-stream and independent stage read-back digests, content bindings, and authenticated-record hashing."
block-buffer = "Fixed-size block buffering for the digest traits and SHA-512."
cc = "Compile BLAKE3's target-specific native implementation inputs."
cfg-if = "Select architecture and feature-specific implementations in the hash and signature stack."
constant_time_eq = "Fixed-length digest equality in BLAKE3."
cpufeatures = "Runtime architecture feature selection in BLAKE3, Curve25519, and SHA-2."
crc32c = "Detect torn or corrupt journal frames before authenticated record decoding."
crypto-common = "Common cryptographic traits, block widths, and output sizes for digest implementations."
curve25519-dalek = "Curve and scalar arithmetic backing Ed25519 signatures."
curve25519-dalek-derive = "Generate architecture-specialized Curve25519 code."
digest = "Cryptographic digest and block interfaces for Ed25519's uses of SHA-512."
ed25519 = "Representation and signature traits for Ed25519 signatures."
ed25519-dalek = "Sign and verify journal records and receipts."
errno = "Access native thread-local error codes in the rustix libc backend."
find-msvc-tools = "Locate the MSVC compiler and toolchain for cc."
generic-array = "Use type-level sizes for arrays in the digest stack."
itoa = "Format integer fields in CLI JSON output."
libc = "Expose macOS ABI types, flags, and functions needed by the native adapter and OS wrappers."
linux-raw-sys = "Provide Linux syscall ABI definitions for rustix."
memchr = "Byte search used by serde_json."
minicbor = "Read and write bounded, explicitly encoded journal records and receipts."
proc-macro2 = "Represent token streams for code generated by derive macros."
quote = "Construct Rust tokens for the desugared derive output."
rustc_version = "Detect compiler versions in CRC32C and Curve25519 build scripts."
rustix = "Capability-scoped filesystem operations and access to process and entropy facilities."
semver = "Parse compiler version requirements for build-time capability detection."
serde = "Describe stable CLI report field and enum names."
serde_core = "Serialization and deserialization traits shared by Serde and serde_json."
serde_derive = "Generate report serialization trait implementations at build time."
serde_json = "Serialize versioned CLI report values to JSON."
sha2 = "SHA-512 for Ed25519 signing and verification."
shlex = "Interpret compiler command and flag syntax used by cc."
signature = "Signature trait interface used by the Ed25519 signature representation."
subtle = "Constant-time selection and equality in the Ed25519 and Curve25519 stack."
syn = "Parse Rust input to signature-backend and report derive macros."
typenum = "Type-level arithmetic for digest sizes and fixed-array lengths."
unicode-ident = "Recognize Rust Unicode identifiers during macro expansion."
uuid = "Represent and encode fixed-size transaction identities."
version_check = "Detect compiler features for generic-array at build time."
zeroize = "Clear temporary copies of signing keys and cryptographic intermediate state."
zmij = "Format floating-point JSON values in serde_json's serializer."

[assessment."blake3@1.8.7"]
archive_sha256 = "6d9e454fc11f76977dc803893aff6304ed33d6a26efae8696573bea74baa27ae"
release_observation = "Local crates.io index lists 1.8.7 on 2026-08-20 after 1.8.6 on 2026-08-05."
security_history = "No package advisory in the recorded RustSec snapshot."
unsafe_exposure = "Native build.rs chooses SIMD inputs. src/platform.rs and src/ffi_* dispatch into target-specific implementations. Audit CPU detection and native code for each selected backend."
resource_limits = "Transfer callers stream fixed-size buffers. Hash state has bounded size and work grows with total accepted bytes."
adversarial_inputs = "Callers feed arbitrary file bytes and compare a separate stage read-back digest. The digest binding assumes collision resistance."
verification = "ExaCopy content-stream and transfer read-back tests cover the integration. Native SIMD implementations need separate source and baseline CPU evidence."
replacement = "Retain the BLAKE3 digest and exact byte encoding or migrate authenticated records and receipts through an explicit new format."
review_gaps = ["Selected native build and architecture-dispatch review", "Independent exact-version suitability evidence"]

[assessment."crc32c@0.6.9"]
archive_sha256 = "7f132a176423ee852e8f0a35d43088d1850966b50745be818a88b76f64b1c6cb"
release_observation = "Local crates.io index lists 0.6.9 on 2026-11-02 after 0.6.8 on 2024-06-09."
security_history = "No package advisory in the recorded RustSec snapshot."
unsafe_exposure = "src/hw_x86_64.rs, src/hw_aarch64.rs, and src/util.rs contain intrinsic and pointer paths. build.rs probes the compiler."
resource_limits = "Journal frame payloads are capped at 1 MiB before checksum processing. Work is linear in the bounded frame."
adversarial_inputs = "CRC detects incidental corruption. Independently validate frame structure and authenticate records before treating them as authority."
verification = "Journal tests and the journal-frame fuzz target exercise framing and damaged-input handling. CPU dispatch paths require separate qualification."
replacement = "A replacement must reproduce CRC32C parameters and existing frame vectors."
review_gaps = ["Hardware and software path suitability review", "Independent exact-version suitability evidence"]

[assessment."ed25519-dalek@2.2.0"]
archive_sha256 = "70e796c081cee67dc755e1a36a0a172b897fab85fc3f6bc48307991f64e4eca9"
release_observation = "Local crates.io index lists 2.2.0 on 2025-07-09 and a new 3.0.0 major release on 2026-07-06. Review any planned major upgrade against persisted signatures and build features."
security_history = "RUSTSEC-2022-0093 is patched from version 2 onward in the recorded snapshot."
unsafe_exposure = "The archive exposes a feature-gated src/hazmat.rs surface. The selected verification path relies on transitive curve25519-dalek backends, SHA-2, and zeroization."
resource_limits = "Callers provide fixed-size keys and signatures and bound the signed record before verification."
adversarial_inputs = "Public keys, signatures, and signed structures are decoded by bounded callers and verified against the expected body and key."
verification = "Journal and transfer tests exercise authenticated records and rejection; ExaCopy's model proofs use a cryptographic trust assumption."
replacement = "An independently reviewed implementation must preserve Ed25519 encoding and strict verification semantics or define explicit migration for authenticated records."
review_gaps = ["Selected constant-time, strict verification, and transitive implementation review", "Independent exact-version suitability evidence"]

[assessment."libc@0.2.191"]
archive_sha256 = "65cd87c9a6d60536580b316ad985726104730a5151c99845f2490428ef91240a"
release_observation = "Local crates.io index lists 0.2.191 on 2026-10-16."
security_history = "No package advisory in the recorded RustSec snapshot."
unsafe_exposure = "The target-specific src/unix ABI declarations are direct FFI. The native adapter owns pointer, structure layout, lifetime and return code contracts."
resource_limits = "The ABI exposes platform-specific operations; caller bounds and rights checks control handle, memory and I/O use."
adversarial_inputs = "The adapter validates identity, paths, flags, and returned values under its handle and filesystem contracts before authorizing effects."
verification = "Native platform tests exercise the selected adapter operations; the source inventory leaves ABI and filesystem qualification distinct."
replacement = "Substitute an equivalent safe OS binding where available and requalify the affected native adapter."
review_gaps = ["Review selected ABI bindings and their callers on each target", "Independent exact-version suitability evidence"]

[assessment."minicbor@2.3.0"]
archive_sha256 = "c12b4033ffaa92fbf9df03df38d19324f52bad130dd223f811734a8006dd2d69"
release_observation = "Local crates.io index lists 2.3.0 on 2026-07-23 and 2.3.1 on 2026-10-18."
security_history = "No package advisory in the recorded RustSec snapshot."
unsafe_exposure = "Archive src/decode.rs and src/bytes.rs contain array-initialization and byte-cast unsafe code. The feature matrix disables dependency default and allocation features."
resource_limits = "ExaCopy uses explicit bounded encoders and decoders with per-format record size maxima."
adversarial_inputs = "Callers validate explicit tags, lengths, the required version, typed fields, and complete record consumption. Fuzz inputs include malformed framing and records."
verification = "Journal fixtures, codec tests and the journal fuzz target cover the project encoding and rejection behavior."
replacement = "Preserve canonical CBOR bytes and existing rejection behavior or introduce a versioned dual-reader transition."
review_gaps = ["Audit selected decoder and encoder paths for malformed inputs", "Independent exact-version suitability evidence"]

[assessment."rustix@1.1.6"]
archive_sha256 = "e5e76742e5294153d4dde1207dbec5bdd81eef6fabdc0d2118babadabfd858aa"
release_observation = "Local crates.io index lists 1.1.6 on 2026-10-27."
security_history = "No package advisory in the recorded RustSec snapshot."
unsafe_exposure = "src/backend/linux_raw and src/backend/libc perform system calls and native ABI translation. The effective graph selects target-specific facilities."
resource_limits = "ExaCopy owns handle/path lifetime and stream bounds. Native syscalls can block under the filesystem contract."
adversarial_inputs = "Adapter contracts handle short I/O, stale identities, permissions, and ambiguous filesystem observations independently of the safe syscall wrapper."
verification = "Native platform tests exercise rights and adapter-specific transitions; Linux process-kill tests cover relevant recovery integration."
replacement = "A replacement needs equivalent descriptor semantics and native qualification of preservation, recovery and publication ordering."
review_gaps = ["Review selected syscall, ABI, and ownership paths", "Independent exact-version suitability evidence"]

[assessment."serde@1.0.229"]
archive_sha256 = "4148590afebada386688f18773da617792bf2ef03ffc1e4cbd2b1d45b023e0ba"
release_observation = "Local crates.io index lists 1.0.229 on 2026-07-18."
security_history = "No package advisory in the recorded RustSec snapshot."
unsafe_exposure = "src/core/format.rs and src/core/ser/impls.rs expose unchecked UTF-8 conversions. serde_core provides the enabled core traits and serde_derive runs at build time."
resource_limits = "The CLI serializes typed report fields and owns the size of constructed report data."
adversarial_inputs = "Product use emits typed values. Input bytes and names must be represented through the established report encodings."
verification = "CLI contract tests check field encodings and command status behavior."
replacement = "Preserve the established JSON wire contract and verify generated variants and field names against the existing fixtures."
review_gaps = ["Review generated serialization and selected Serde core code", "Independent exact-version suitability evidence"]

[assessment."serde_json@1.0.154"]
archive_sha256 = "e7e9cc8b1b85264074fbcc02a88680c4096b1e47df8f739dceb03bf482f04bd6"
release_observation = "Local crates.io index lists 1.0.154 on 2026-10-11."
security_history = "No package advisory in the recorded RustSec snapshot."
unsafe_exposure = "Archive src/ser.rs uses unchecked UTF-8 conversion for string runs and src/read.rs contains pointer-offset code. Product call sites use to_writer with typed report values."
resource_limits = "Serialize to the nominated output stream. Collection size and construction memory are set by report producers."
adversarial_inputs = "CLI report tests exercise escaping and serialization of user-provided path representations. Product entry points use the serialization surface."
verification = "CLI contract tests verify JSON report structure and exit status."
replacement = "Use an equivalent interoperable JSON serializer and retain wire fixtures, escaping behavior, and error propagation."
review_gaps = ["Review output escaping and selected serializer dependencies", "Independent exact-version suitability evidence"]

[assessment."uuid@1.29.3"]
archive_sha256 = "3c14b15dffa2f4bd712103e857140aa04a4f2ff6e955c77d7eb8e53ee02a3b64"
release_observation = "Local crates.io index lists 1.29.3 on 2026-11-17."
security_history = "No package advisory in the recorded RustSec snapshot."
unsafe_exposure = "Archive src/fmt.rs and src/non_nil.rs contain unsafe string/representation operations. ExaCopy uses fixed-byte decoding and CLI formatting with generators and Serde disabled."
resource_limits = "Every stored transaction identity has a fixed 16-byte representation."
adversarial_inputs = "ExaCopy's typed wrapper enforces the identity contract and binds job, entry, and epoch before decisions."
verification = "Model identity and transaction properties exercise the application boundary."
replacement = "Preserve the stable bytes and identifier text where exposed in existing records and CLI output."
review_gaps = ["Review fixed-byte and formatting paths in the selected build", "Independent exact-version suitability evidence"]

[assessment."zeroize@1.9.2"]
archive_sha256 = "85ccff8a4805aba1eaa4cd4afcd49f7557dd2cf5fd79ffc37f8959466effc5aa"
release_observation = "Local crates.io index lists 1.9.2 on 2026-11-17."
security_history = "No package advisory in the recorded RustSec snapshot."
unsafe_exposure = "Archive src/lib.rs uses volatile writes and compiler fences. src/x86.rs, src/aarch64.rs, and src/bulk.rs include optimized memory clearing paths."
resource_limits = "Direct CLI use clears bounded temporary signing key material; library use also clears cryptographic intermediate state."
adversarial_inputs = "Erasure applies to owned buffers at the selected locations. Copies caused by compiler movement, process dumps, or other owners require separate exposure review."
verification = "CLI and signed-record tests exercise the integration; inspect compiled erasure for a claimed compiler and architecture."
replacement = "Use a reviewed erasure implementation with equivalent guarantees and revalidate key lifetime and copy boundaries."
review_gaps = ["Review emitted erasure and key lifecycle on supported compiler and targets", "Independent exact-version suitability evidence"]
