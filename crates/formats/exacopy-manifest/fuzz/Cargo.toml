[package]
name = "exacopy-manifest-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
exacopy-manifest = { path = ".." }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "manifest_json"
path = "fuzz_targets/manifest_json.rs"
test = false
doc = false
bench = false

[workspace]
resolver = "3"
