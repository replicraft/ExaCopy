[package]
name = "exacopy-codec-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
blake3 = { version = "=1.8.7", default-features = false }
exacopy-codec = { path = ".." }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "manifest_json"
path = "fuzz_targets/manifest_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan_entries_page"
path = "fuzz_targets/plan_entries_page.rs"
test = false
doc = false
bench = false

[[bin]]
name = "plan_body"
path = "fuzz_targets/plan_body.rs"
test = false
doc = false
bench = false

[workspace]
resolver = "3"

[[bin]]
name = "plan_json"
path = "fuzz_targets/plan_json.rs"
test = false
doc = false
bench = false
