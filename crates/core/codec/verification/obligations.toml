schema_version = 1

[[obligation]]
id = "P-010"
requirement_ids = ["R-182"]
source = "src/manifest/json.rs"
symbols = ["decode", "decode_basename", "parse_length"]
assumptions = [
    "This Rust gate covers the supported single-file unsigned manifest shape and exercised JSON admission boundaries.",
    "The manifest decoder accepts an in-memory slice. The caller bounds reads before providing that slice.",
    "The gate observes typed parser outcomes on fixed fixtures. It does not establish universal parser refinement.",
]
gates = ["rust"]
rust = { file = "tests/manifest.rs", test = "malformed_objects_duplicates_trailing_data_and_oversize_fail", oracle = "The valid envelope at the JSON byte limit decodes, while the oversized slice, truncated prefixes, duplicates, malformed objects and trailing document are rejected." }

[[obligation]]
id = "P-037"
requirement_ids = ["R-193"]
source = "src/plan_entries.rs"
symbols = ["PlanEntriesPage::from_canonical_cbor"]
assumptions = [
    "Scoped under the P-010 parser boundary for one public PlanEntries leaf.",
    "The caller obtains the expected reference from its bound parent and limits I/O before providing an in-memory slice.",
    "The digest-binding result assumes BLAKE3 collision resistance and does not authorize filesystem changes.",
    "Multi-level traversal and the complete public Plan envelope are outside this Rust gate.",
]
gates = ["rust"]
rust = { file = "tests/plan_entries.rs", test = "document_reference_rejects_other_kind_and_wrong_digest", oracle = "A portable golden PlanEntries leaf verifies only in its own kind and digest domain. Wrong kind, digest, count, length, and excessive input fail closed." }

[[obligation]]
id = "P-038"
requirement_ids = ["R-155"]
source = "src/plan.rs"
symbols = ["PlanBody::from_canonical_cbor", "digest_bytes"]
assumptions = [
    "The caller supplies the expected digest bound by its parent or reviewed record.",
    "This Rust gate covers the canonical Plan body and digest without interpreting an approval or authorizing a filesystem effect.",
    "The digest-binding result assumes BLAKE3 collision resistance.",
]
gates = ["rust"]
rust = { file = "tests/plan_body.rs", test = "canonical_policy_and_resource_intent_are_bound_to_the_expected_digest", oracle = "The independent protected-plan vector matches its digest. A modified declared policy, budget or page order fails under the original expected digest." }
