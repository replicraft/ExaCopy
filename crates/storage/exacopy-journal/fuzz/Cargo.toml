[package]
name = "exacopy-journal-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
exacopy-journal = { path = ".." }
libfuzzer-sys = "=0.4.13"

[[bin]]
name = "journal_frame"
path = "fuzz_targets/journal_frame.rs"
test = false
doc = false
bench = false

[workspace]
resolver = "3"
