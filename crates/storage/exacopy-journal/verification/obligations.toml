schema_version = 1

[[obligation]]
id = "P-040"
requirement_ids = ["R-155"]
source = "src/owner/apply.rs"
symbols = ["PublicApplyOwnerRecord::decode"]
assumptions = [
    "This scoped Rust gate tests externally selected profile/key and signature-domain binding of local public-apply owner declarations.",
    "Ed25519 security and profile-key custody are assumptions, not proven by these fixtures.",
    "The authenticated declaration is not a portable Approval signature, actual content measurement, native recovery qualification or effect authorization.",
]
gates = ["rust"]
rust = { file = "tests/public_apply_owner.rs", test = "independent_profile_and_signature_domain_are_mandatory", oracle = "The independent signed public-apply fixture admits only under its selected profile/key and domain. Foreign profile, foreign key and other signature prefixes are rejected." }

[[obligation]]
id = "P-042"
requirement_ids = ["R-015", "R-155"]
source = "src/intent/public_apply.rs"
symbols = ["PublicApplyIntent::decode", "PublicApplyIntent::from_frame"]
assumptions = [
    "The codec accepts recorded claims. A caller independently verifies the signed owner, full chain, qualification, time and actual effect prerequisites.",
    "This Rust check exercises frame and format admission. Executor decisions and native durability have separate obligations.",
]
gates = ["rust"]
rust = { file = "tests/public_apply_intent.rs", test = "enclosing_kind_and_exact_predecessor_are_required", oracle = "An accepted kind-7 envelope names the exact prior metadata digest and sequence. The legacy reader rejects the same public frame, and the public reader refuses a wrong record kind or altered predecessor." }

[[obligation]]
id = "P-043"
requirement_ids = ["R-013", "R-140", "R-216"]
source = "src/remote_download/owner.rs"
symbols = ["RemoteDownloadOwnerRecord::decode"]
assumptions = [
    "The selected local key and owner profile come from independent trust. Ed25519 and BLAKE3 are trusted primitives.",
    "This Rust gate covers canonical format admission and frame binding. The application verifies actual scope, earlier frame identities, held observations, and directory and durability prerequisites.",
]
gates = ["rust"]
rust = { file = "tests/remote_download.rs", test = "independent_owner_and_frame_vectors_round_trip_in_the_remote_profile", oracle = "Independent canonical CBOR and OpenSSL signatures match the exact Rust owner and private payloads. The selected profile validates the envelope and the frame decoder validates the exact framing predecessor." }

[[obligation]]
id = "P-044"
requirement_ids = ["R-013", "R-017", "R-140"]
source = "src/remote_download/replay.rs"
symbols = ["replay_remote_download"]
assumptions = [
    "The caller selects the exact first segment and independently authenticates its scoped owner under a trusted local key.",
    "The framed Rust fixtures apply to historical claims. Native artifact provenance, barriers and recovery authority have separate obligations.",
]
gates = ["rust"]
rust = { file = "tests/remote_download_replay.rs", test = "framed_replay_burns_allocations_and_keeps_only_exact_active_progress", oracle = "The scanner retains every admitted allocation and only advances contiguous checkpoint evidence for its exact prepared stage and source pass. Superseded or unbound attempts cannot contribute progress to the latest capture." }

[[obligation]]
id = "P-045"
requirement_ids = ["R-013", "R-017", "R-140"]
source = "src/remote_download/replay.rs"
symbols = ["replay_remote_download_with_bootstrap"]
assumptions = [
    "The caller independently chooses the required profile and selects the trusted owner key and the first private journal segment.",
    "Directory identity and complete frames are historical claims. The application must establish the current held objects, namespace and append barriers separately.",
]
gates = ["rust"]
rust = { file = "tests/remote_download_bootstrap.rs", test = "strict_transcript_keeps_only_complete_authenticated_boundaries_at_every_cut", oracle = "Every byte cut retains exactly the complete admitted prefix. No allocation appears before the signed stage-directory record and incomplete bootstrap remains reconciliation." }

[[obligation]]
id = "P-046"
requirement_ids = ["R-013", "R-015", "R-017", "R-140"]
source = "src/remote_download/finalization/receipt.rs"
symbols = ["RemoteDownloadReceipt::decode", "RemoteDownloadReceipt::validate_evidence"]
assumptions = [
    "Canonical CBOR, independently selected local profile and key, and BLAKE3 follow their documented profiles.",
    "All original frames must come from one independently validated selected held journal, including bootstrap and intervening checkpoint history. The fixture does not authorize effects, qualify native barriers or prove complete replay.",
]
gates = ["rust"]
rust = { file = "tests/remote_finalization.rs", test = "independent_finalization_vectors_round_trip_and_bind_receipt", oracle = "Independently generated canonical framed bodies and exact remote receipt decode and re-encode byte-for-byte. The signed policy, exact prepared run and held stage declarations, independent verification digest and publication frames bind to the selected owner and committed receipt digest." }

[[obligation]]
id = "P-050"
requirement_ids = ["R-013", "R-015", "R-017", "R-140"]
source = "src/remote_download/finalization_replay.rs"
symbols = ["replay_remote_finalization", "RemoteFinalizationReplay::validated_receipt"]
assumptions = [
    "The caller selects one held first segment and authenticates the owner key and directory bootstrap independently. The expected qualification digest and optional receipt artifact come from separately selected inputs.",
    "Replay checks historical declarations and exact framing. It does not establish native object provenance, file or namespace durability, selected route qualification, current grant or writable authority.",
]
gates = ["rust"]
rust = { file = "tests/remote_finalization_replay.rs", test = "only_clear_exact_commit_associates_receipt_after_accepted_checkpoint", oracle = "A receipt associates only with the exact terminal commitment following an authenticated bootstrap and checked current checkpoint prefix. Foreign commitment, missing or malformed artifact and a torn suffix prevent association and retain the preceding accepted boundary." }
