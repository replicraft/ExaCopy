schema_version = 1

[[obligation]]
id = "P-056"
requirement_ids = ["R-253", "R-255"]
source = "src/remote_resume/prefix.rs"
symbols = ["verify_retained_prefix"]
assumptions = [
    "The caller independently binds the current authenticated peer, rooted source path, route, grant and qualification to the exact journal scope, and supplies the exact retained stage under the exclusive lease.",
    "Held adapter identity, epoch, extent and recheck operations report truthful current observations. Source attributes alone supply no persistent identity.",
    "This gate covers read-only prefix evidence and fresh incremental hashing. A native append capability, prefix barrier, synchronized continuation, finalization and receipt remain separate requirements.",
]
gates = ["rust"]
rust = { file = "tests/remote_resume/allocations/prefix.rs", test = "allocations::prefix::verified_prefix_matches_current_and_historical_failure_oracles", oracle = "Freshly compare every reused byte and independently hash historical ranges; vary every source/stage byte and check epochs, identity, extents, scratch bounds, dirty failed reads and cancellation without leaking partial evidence. Equal new bytes beyond the original writer extent must refuse before I/O." }

[[obligation]]
id = "P-063"
requirement_ids = ["R-269", "R-270", "R-276"]
source = "src/sync_genesis.rs"
symbols = ["verify_sync_genesis"]
assumptions = [
    "The caller selects an owner profile, canonical strong Ed25519 key, exact historical root digest, raw subject and ordered typed endpoint expectations independently of the artifact.",
    "BLAKE3 and Ed25519 provide their ordinary cryptographic properties. The resolver opens a read-only view and the reader bounds its own reads by the exact committed length with one EOF probe.",
    "A verified artifact supplies historical observations. Live native readmission, fresh observation, owner-controlled publication and sync operations have separate gates.",
]
gates = ["rust"]
rust = { file = "tests/sync_genesis.rs", test = "independent_signed_workflow_closure_vectors_match_and_refuse", oracle = "An independent canonical CBOR, BLAKE3 and Ed25519 oracle builds signed one-root/two-endpoint/one-leaf closures. Three valid vectors bind exact scope and observations. Forty-three malformed, foreign, unselected, incomplete or inconsistent candidates refuse. Counted resolvers assert zero child opens for every root-local refusal." }
