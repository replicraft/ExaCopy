[package]
name = "exacopy-transfer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
experimental-apfs-copy = [
	"dep:ed25519-dalek",
	"dep:exacopy-model",
	"dep:minicbor",
]

[dependencies]
blake3.workspace = true
exacopy-content.workspace = true
exacopy-endpoint.workspace = true
exacopy-journal.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
exacopy-manifest.workspace = true
exacopy-plan.workspace = true
ed25519-dalek.workspace = true
exacopy-model.workspace = true
minicbor.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ed25519-dalek = { workspace = true, optional = true }
exacopy-model = { workspace = true, optional = true }
minicbor = { workspace = true, optional = true }

[lints]
workspace = true
