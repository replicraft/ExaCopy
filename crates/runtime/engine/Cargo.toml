[package]
name = "exacopy-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
experimental-apfs-copy = [
	"dep:exacopy-content",
	"dep:exacopy-endpoint",
	"dep:exacopy-journal",
	"dep:exacopy-model",
	"dep:exacopy-platform",
	"dep:exacopy-transfer",
	"exacopy-transfer/experimental-apfs-copy",
]

[target.'cfg(target_os = "linux")'.dependencies]
exacopy-content.workspace = true
exacopy-endpoint.workspace = true
exacopy-journal.workspace = true
exacopy-model.workspace = true
exacopy-platform.workspace = true
exacopy-transfer.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
blake3.workspace = true
ed25519-dalek.workspace = true
rustix.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
exacopy-content = { workspace = true, optional = true }
exacopy-endpoint = { workspace = true, optional = true }
exacopy-journal = { workspace = true, optional = true }
exacopy-model = { workspace = true, optional = true }
exacopy-platform = { workspace = true, optional = true }
exacopy-transfer = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
blake3.workspace = true
ed25519-dalek.workspace = true

[lints]
workspace = true
