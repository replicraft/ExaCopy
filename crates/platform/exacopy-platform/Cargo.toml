[package]
name = "exacopy-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
windows-read-fixture = []
experimental-windows-read = ["dep:exacopy-endpoint", "dep:windows-sys"]
experimental-windows-copy = ["dep:exacopy-endpoint", "dep:exacopy-model", "dep:windows-sys"]

[[test]]
name = "windows_read"
path = "tests/windows_read.rs"
required-features = ["windows-read-fixture"]

[target.'cfg(target_os = "linux")'.dependencies]
exacopy-endpoint.workspace = true
exacopy-model.workspace = true
rustix = { workspace = true, features = ["rand"] }

[target.'cfg(target_os = "macos")'.dependencies]
apfs-mounted.workspace = true
exacopy-endpoint.workspace = true
exacopy-model.workspace = true
getrandom.workspace = true
libc.workspace = true
rustix = { workspace = true, features = ["try_close"] }

[target.'cfg(target_os = "windows")'.dependencies]
exacopy-endpoint = { workspace = true, optional = true }
exacopy-model = { workspace = true, optional = true }
windows-sys = { workspace = true, optional = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[target.'cfg(target_os = "windows")'.dev-dependencies]
exacopy-diff.workspace = true
exacopy-endpoint.workspace = true
windows-sys = { workspace = true, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_SystemServices", "Win32_System_Threading"] }

[lints]
workspace = true
