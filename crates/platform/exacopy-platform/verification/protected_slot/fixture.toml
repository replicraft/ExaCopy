schema_version = 1
id = "linux-protected-slot-observation"
target = "x86_64-unknown-linux-gnu"
profile = "linux-unprivileged-same-device-bind-v1"
rust_toolchain = "1.100.0"
runner = "verification/protected_slot/run.py"
controls = "verification/protected_slot/test_runner.py"
workflow = ".github/workflows/linux-protected-slot-qualification.yml"
result = "result.json"

[[case]]
selector = "linux::protected_slot::tests::distinguishes_lookup_absence_and_rebound_objects"
