[[obligation]]
id = "P-036"
requirement_ids = ["R-082", "R-093", "R-097", "R-100"]
source = "src/compare/parallel.rs"
symbols = ["compare_views_parallel", "compare_parallel", "partition"]
assumptions = [
    "An exact positioned read fills its supplied bytes synchronously or returns an error.",
    "The serial oracle and model use one fixed set of per-range observations. Actual live inputs may change.",
    "The stop marker can be observed late. A worker skips only after a lower range has a decisive outcome or a worker-control failure has occurred.",
    "The model uses each worker's earliest decisive window outcome and checks result selection and joining. It abstracts individual I/O, byte offsets, atomic representation, and lexicographic ordering within a range.",
]
