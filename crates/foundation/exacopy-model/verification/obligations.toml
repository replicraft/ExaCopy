schema_version = 1

[[obligation]]
id = "P-001"
requirement_ids = ["R-007", "R-015"]
source = "src/transaction.rs"
symbols = ["CopySession::apply", "CopyEffect"]
assumptions = ["The executor honors the read-only request and the supplied binding."]
gates = ["rust"]
rust = { test = "every_phase_checks_event_order_stop_rules_and_completion_binding", file = "tests/transaction.rs", oracle = "Every accepted event emits only the expected read or exclusive-publication request, or emits no request." }

[[obligation]]
id = "P-002"
requirement_ids = ["R-008", "R-320"]
source = "src/transaction.rs"
symbols = ["CopyEffect", "PublishNoClobber"]
assumptions = ["The model's exclusive publication primitive preserves an incumbent atomically.", "The abstract destination is a single protected namespace entry."]
gates = ["rust", "tlc"]
rust = { test = "repeated_prepare_and_publish_intent_cannot_authorize_a_second_effect", file = "tests/transaction.rs", oracle = "The publication event authorizes a single exclusive request for the bound stage." }
tlc = { spec = "verification/tla/CopyRecovery.tla", config = "verification/tla/CopyRecovery.cfg", negative_control = "verification/tla/CopyRecoveryEarlyPublication.cfg", model_bounds = ["One entry and target name, two source views, one crash and one retained-stage recovery epoch."], seeds = ["TLC seed and fingerprint index 0."], oracle = "TLC exhausts the safety configuration including incumbent preservation during retained-stage retry and detects the publication mutations." }

[[obligation]]
id = "P-003"
requirement_ids = ["R-015", "R-017", "R-320"]
source = "src/transaction.rs"
symbols = ["CopySession::apply", "CopyPhase"]
assumptions = ["The caller reports only established identity, quiescence, data and journal barriers, verification, metadata and sealing observations.", "The coordinator gives each new attempt a unique binding."]
gates = ["rust", "tlc"]
rust = { test = "tlc_early_publication_counterexample_stops_before_namespace_effect", file = "tests/transaction.rs", oracle = "The Rust trace rejects publication intent before the reported stage is verified and sealed." }
tlc = { spec = "verification/tla/CopyRecovery.tla", config = "verification/tla/CopyRecovery.cfg", negative_control = "verification/tla/CopyRecoveryEarlyPublication.cfg", model_bounds = ["One entry and target name, two source views, one crash and one retained-stage recovery epoch."], seeds = ["TLC seed and fingerprint index 0."], oracle = "TLC exhausts the safety configuration and rejects both early publication and an unverified retained-stage retry through PriorPublicationEvidence." }

[[obligation]]
id = "P-004"
requirement_ids = ["R-018", "R-176", "R-178", "R-179", "R-181", "R-319", "R-321"]
source = "src/range.rs"
symbols = ["checked_range_end"]
assumptions = ["The proof covers one positive write range. Allocation, partition and permit ownership have separate obligations.", "Charon and Aeneas preserve the semantics of the selected Rust operations and the pinned scalar models."]
gates = ["rust", "lean", "kani"]
rust = { test = "checked_ranges_agree_with_wide_integer_arithmetic", file = "tests/range.rs", seeds = ["ChaCha 0x4558_4143_5241_4E47, 1024 cases and persisted regressions."], oracle = "Compare the executable result with a wider integer oracle for contained half-open ranges." }
lean = { theorem = "ExaCopy.Proofs.checked_range_end_spec", proof = "verification/Proofs/Range.lean", generated = "verification/Generated/Funs.lean", axioms_tcb = ["propext", "Classical.choice", "Quot.sound", "Lean 4.31.0 kernel", "Pinned Charon, Aeneas and hax scalar models."], oracle = "Regenerate Lean from the actual Rust function, check the exact mathematical specification in the kernel and verify the theorem's axiom dependencies." }
kani = { harness = "kani_checks::range::checked_range_end_matches_wide_arithmetic", file = "verification/kani/range.rs", unwind_bound = 1, model_bounds = ["Full Cartesian product of three u64 inputs with no harness assumptions."], oracle = "Prove equivalence to the wider integer oracle and reach all six guard-behavior covers with unwinding assertions enabled." }

[[obligation]]
id = "P-041"
requirement_ids = ["R-269", "R-270"]
source = "src/sync.rs"
symbols = ["classify_two_way_path"]
assumptions = ["One fixed endpoint pair, raw path and policy with truthful complete, unavailable or unsupported observations.", "The abstract matching receipt binds the side, scan generation and observed evidence. Receipt authenticity and retention are supplied assumptions.", "Rust replay links only the finite classifier subjects to implementation. Baseline admission and generation advancement exist solely in the TLA+ model."]
gates = ["rust", "tlc"]
rust = { test = "sync_classifier_matches_all_tlc_subjects", file = "tests/sync_tlc.rs", oracle = "Compare the public Rust classifier with all 432 distinct rows from the independently modeled TLA+ decision matrix, including content-only and required-metadata-only differences." }
tlc = { spec = "verification/tla/SyncBaseline.tla", config = "verification/tla/SyncBaseline.cfg", negative_control = "verification/tla/SyncBaselineTreatUnknownAsAbsent.cfg", model_bounds = ["One path, two fixed endpoints, 432 initial classifier subjects, one scan at generation 1, one competing generation advance and at most one receipt per endpoint."], seeds = ["TLC seed and fingerprint index 0."], oracle = "Exhaust all reachable states and require an exact 432-row table match. Require complete, known observations and paired matching receipts for modeled baseline admission at the current predecessor, and detect unknown-as-absence, receipt bypass and stale-generation controls." }

[[obligation]]
id = "P-053"
requirement_ids = ["R-269", "R-270"]
source = "src/sync_genesis.rs"
symbols = ["admit"]
assumptions = [
    "One exact subject at two selected, ordered roots. Caller-supplied identities and scope/policy projections faithfully describe the admitted native observations.",
    "Both reads independently verify complete supported regular files, EOF and required metadata. Completion and recheck positions are truthful and monotonic within the current scan.",
    "Native identity, lease, measurement and artifact persistence are separate obligations. This result contains observation evidence and has no effect authority.",
]
gates = ["rust"]
rust = { file = "tests/sync_genesis.rs", test = "genesis_matches_independent_bounded_observation_oracle", oracle = "The independent defect oracle accepts only complete matched pairs in a finite product of 16 reported-fault axes and both read orders (131072 cases, two healthy). Accepted outputs retain the ordered observations and exact selection." }

[[obligation]]
id = "P-057"
requirement_ids = ["R-253"]
source = "src/retained_prefix.rs"
symbols = ["Continuation::begin", "Continuation::permit_tail", "Continuation::checkpoint", "Continuation::complete_tail"]
assumptions = [
    "The live capability owner truthfully reports exact retained stage, active exclusive lease, approved scope and fresh source. Quiescence and old history classification are independently confirmed.",
    "Fresh prefix comparison, independent historical digests, actual stage extent, prefix and chunk barriers and canonical durable journal successors and genuinely reserved closeout and receipt capacity are verified by their native and storage owners before they are reported.",
    "One serialized coordinator owns the admitted stage. A rejected or uncertain execution must reconcile outside this pure model. The model grants no filesystem, publication or recovery authority by itself.",
]
gates = ["rust", "tlc"]
rust = { file = "tests/retained_prefix.rs", test = "retained_prefix_requires_ordered_evidence_and_exact_tail_completions", oracle = "Tails are refused before the verified prefix barrier and durable continuation. Two exact contiguous tracked chunks proceed only through a confirmed intermediate checkpoint. Overlapping or unbounded ranges refuse." }
tlc = { spec = "verification/tla/RetainedPrefix.tla", config = "verification/tla/RetainedPrefix.cfg", negative_control = "verification/tla/RetainedPrefixEarlyPermit.cfg", seeds = ["TLC seed and fingerprint index 0."], model_bounds = ["One retained unit, zero or two tail units, one old writer, two source labels, one continuing lineage, four capacity states and journal ends bounded by 8."], oracle = "Model exhausts both tail completions through a durable checkpoint without accepting prefix overwrite, post-intent/unknown history or a stale scope, source or head. Eight negative controls exercise early permit, overwrite, missing checkpoint, lost context, stale source, stale head, nonsticky ambiguous completion, and omitted closeout capacity." }

[[obligation]]
id = "P-066"
requirement_ids = ["R-008", "R-253", "R-255", "R-320"]
source = "src/witnessed_publication.rs"
symbols = ["observe_recovery"]
assumptions = [
    "The held protected witness name and namespace remain in qualified custody across process restart. The same-principal or privileged tampering case is outside that scope.",
    "The caller validates owner/scope, exact journal ancestry, current authority and complete simultaneous native observations. Positive recovery describes one observation point and gives no filesystem authority.",
    "Pure executable namespace admission and the independent finite kernel/process model are separate evidence. This gate makes no native crash or power-loss claim.",
]
gates = ["rust", "tlc"]
rust = { file = "tests/witnessed_publication.rs", test = "recovery_requires_every_independent_observation_and_current_authority", oracle = "Vary 16 independent recovery defects and require exactly one approved complete simultaneously held binding." }
tlc = { spec = "verification/tla/WitnessNamespace.tla", config = "verification/tla/WitnessNamespace-healthy.cfg", negative_control = "verification/tla/WitnessNamespace-reuse-witnessed.cfg", model_bounds = ["Two reusable inode slots, four names, three open references, a single protected witness, independent grant and retention approval, and one process crash/restart."], seeds = ["TLC seed and fingerprint index 0."], oracle = "Exhaust healthy protected inode lifetime and one-shot live rename paths. The checker detects ignored witness retention, witness alone, stale held target, and post-crash rename." }

[[obligation]]
id = "P-067"
requirement_ids = ["R-031", "R-032", "R-033", "R-034"]
source = "src/protected_replace.rs"
symbols = ["Session::start", "Session::authorize_capture", "Session::observe_capture", "Session::acknowledge_capture", "Session::authorize_publication"]
assumptions = [
    "Caller verifies one explicit slot-at-effect and separate exclusive publication authority, layout, isolation, exact raw bindings, and current lease and grant serialization through the native effect.",
    "Opaque entry relocation is confined to one literal same-filesystem pair of target and recovery names without following links, crossing mounts, overwriting, traversing or deleting. A separate physical source filesystem does not itself prove subtree exclusion.",
    "Replay covers all relevant attempts and authoritative history, independently matches the current durable head and held context, and refuses re-admitting a scope whose earlier intent could have taken effect. The native coordinator enforces one unique admission under its held lease.",
    "The coordinator truthfully reports matching stage evidence, both actual namespace barriers, independently observed durable journal successors and current captured and image facts. A required independent image uses separate qualified read and creation authority.",
    "The bounded decision and namespace model do not execute native effects or grant restoration, deletion, automatic crash retry or power-loss guarantees.",
]
gates = ["rust", "tlc"]
rust = { file = "tests/protected_replace.rs", test = "rejects_previously_issued_or_uncertain_history_at_fresh_admission", oracle = "After issued capture uncertainty, prior or indeterminate replay, stale held scope or divergent heads cannot admit a new capture. A fresh attempt still refuses a capture intent with the wrong predecessor." }
tlc = { spec = "verification/tla/ProtectedReplacement.tla", config = "verification/tla/ProtectedReplacement.cfg", negative_control = "verification/tla/ProtectedReplacementAdmitPriorHistory.cfg", seeds = ["TLC seed and fingerprint index 0."], model_bounds = ["One selected source, verified stage, target and reserved recovery name with one pre-capture replacement, one late arrival, one private collision, either image policy, clean/prior/ambiguous initial history, one defect at a time in approval, disclosure, either current grant or replay agreement, and one interrupted attempt."], oracle = "Exhaust the modeled namespace histories and reject fourteen weakened controls. Preserve actual capture, older and racing entries, expected-incumbent gating, post-barrier evidence, required image, public no-clobber, sticky uncertainty and fresh authorized admission before intent." }

[[obligation]]
id = "P-075"
requirement_ids = ["R-253", "R-255", "R-320"]
source = "verification/tla/WitnessedCloseoutPhase.tla"
symbols = ["BoundedAndExact", "ReservedCapacity", "CoverageFence", "CustodyFence", "CurrentReceiptPermit"]
assumptions = [
    "A trusted caller supplies the selected owner, exact journal anchor, retained stage, independently verified bytes and epochs, protected names, lease, current authority, and truthful barriers. This model abstracts rather than implements those premises.",
    "The protected receipt has one exact inode, an atomic no-replace move, and exact current held observations. A stopped process cannot reuse its prior permit. A fresh lease must independently observe and reauthorize private convergence.",
    "The bounded TLA+ model exercises the selector-2 phase graph and retained/fresh ancestry. It provides no Rust refinement, native filesystem, qualified process-crash, or power-loss claim.",
]
gates = ["tlc"]
tlc = { spec = "verification/tla/WitnessedCloseoutPhase.tla", config = "verification/tla/WitnessedCloseoutPhase-none.cfg", negative_control = "verification/tla/WitnessedCloseoutPhase-reuse-unknown.cfg", seeds = ["TLC seed and fingerprint index 0."], model_bounds = ["Two physical attempts, initial run counts 1/62/63, at most 64 logical runs, up to two suffix checkpoints, a 64 MiB segment bound, finite sequence ceiling 27, one interruption, and one protected receipt inode with independently reobserved pending/final disposition."], oracle = "Exhaust the healthy phase graph, require the repeated continuation, late-retirement and last-run paths, and reject fourteen weakening controls including direct commit after native success without independent observation and barriers. Require an exact same-session uncertainty counterexample and separately preserve the fresh-convergence counterexample to a stronger global no-resubmission proposition." }

[[obligation]]
id = "P-083"
requirement_ids = ["R-015", "R-155"]
source = "src/grant_time.rs"
symbols = ["check_grant_time"]
assumptions = [
    "The caller supplies a correctly classified monotonic sample and normalized UTC timestamps with subsecond nanoseconds below one billion.",
    "This checks one scalar decision. Clock sampling and classification, the original monotonic anchor, paired state updates, retirement, and serialization against revocation and effects are separate obligations.",
]
gates = ["rust", "lean", "kani"]
rust = { test = "grant_time::tests::grant_time_matches_wide_nanosecond_interval", file = "src/grant_time/tests.rs", oracle = "Compare the production result to a signed wide nanosecond interval oracle across representative signed extremes, equalities, rollover, and empty or reversed bounds." }
lean = { theorem = "ExaCopy.Proofs.check_grant_time_spec", proof = "verification/Proofs/GrantTime.lean", generated = "verification/Generated/GrantTime/Funs.lean", axioms_tcb = ["propext", "Classical.choice", "Quot.sound", "Lean 4.31.0 kernel", "Pinned Charon, Aeneas and hax scalar models."], oracle = "Regenerate the actual grant-time decision and its comparator, require exact generated module bytes, and kernel-check equivalence to signed integer nanosecond ordering, half-open window intersection and regression-before-expiry precedence for normalized timestamps." }
[obligation.kani]
harness = "kani_checks::grant_time::grant_time_matches_wide_nanosecond_specification"
file = "verification/kani/grant_time.rs"
runner = "verification/kani/check-grant-time.sh"
unwind_bound = 1
model_bounds = [
    "One scalar decision over all signed i64 seconds and normalized u32 subseconds for each timestamp, all three monotonic classes, both qualification choices, and arbitrary window endpoints.",
    "The same runner requires the full-width separately verified production comparator contract before accepting the composition evidence. Exactly that comparator may be substituted in the decision harness.",
]
oracle = "Run the actual comparator contract against exact signed i128 nanosecond ordering and check its four boundary covers. Invoke the real decision (with only that verified comparator) against the conjunction of selected half-open windows, exact refusal precedence and non-widening qualification. Require all twelve decision covers."

[[obligation]]
id = "P-085"
requirement_ids = ["R-272"]
source = "verification/tla/ManagedAction.tla"
symbols = [
    "CreateRequiresConfirmedIntent",
    "AtMostOneChildCreation",
    "AtMostOneActivation",
    "AssociationRequiresBoundReceipt",
    "AssociationRequiresConfirmedEvidence",
]
assumptions = [
    "A trusted persistent issuer atomically spends the exact activation before parent append. Its state survives the modeled process restart independently of the physical ledger. This issuer is a design premise, not an implemented native capability.",
    "The coordinator receives truthful authenticated projections of the selected scope, held exclusive lease, finite live authority, physical append and barrier outcomes, bounded independent readback, and exact child v2 terminal evidence. The model does not establish these projections or their native implementation.",
    "The child uses an assumed no-clobber primitive. The model checks proposed action sequencing only; it supplies no Rust correspondence, baseline advancement, native restart, process-crash qualification, or power-loss claim.",
]
gates = ["tlc"]

[obligation.tlc]
spec = "verification/tla/ManagedAction.tla"
config = "verification/tla/ManagedAction.cfg"
negative_control = "verification/tla/ManagedActionTrustPristine.cfg"
seeds = ["TLC seed and fingerprint index 0."]
model_bounds = [
    "Two competing claimants, one selected activation, one prepared action slot, one child attempt per claimant, and at most one process restart.",
    "Separate submitted, persisted and confirmed parent records, finite child settlement and receipt-binding choices, and an independent persistent activation claim.",
]
oracle = "Exhaust the healthy action-ordering graph with nonzero attendance for both confirmed records, child creation, settlement, uncertainty and restart refusal. Require five named single-guard counterexamples for early creation, duplicate creation, pristine-ledger reactivation, foreign receipt association and early association confirmation. Acceptance requires complete raw reports; retain bounded diagnostics and input and report hashes on refusal."
