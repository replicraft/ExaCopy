schema_version = 1

[[obligation]]
id = "P-001"
requirement_ids = ["R-007", "R-015"]
source = "src/transaction.rs"
symbols = ["CopySession::apply", "CopyEffect"]
assumptions = ["The executor honors the read-only request and the supplied binding."]
gates = ["rust"]
rust = { test = "every_phase_checks_event_order_stop_rules_and_completion_binding", file = "tests/transaction.rs", oracle = "Every accepted event emits only the expected read or exclusive-publication request, or emits no request." }

[[obligation]]
id = "P-002"
requirement_ids = ["R-008", "R-320"]
source = "src/transaction.rs"
symbols = ["CopyEffect", "PublishNoClobber"]
assumptions = ["The model's exclusive publication primitive preserves an incumbent atomically.", "The abstract destination is a single protected namespace entry."]
gates = ["rust", "tlc"]
rust = { test = "repeated_prepare_and_publish_intent_cannot_authorize_a_second_effect", file = "tests/transaction.rs", oracle = "The publication event authorizes a single exclusive request for the bound stage." }
tlc = { spec = "verification/tla/CopyRecovery.tla", config = "verification/tla/CopyRecovery.cfg", negative_control = "verification/tla/CopyRecoveryEarlyPublication.cfg", model_bounds = ["One entry and target name, two source views, one crash and one retained-stage recovery epoch."], seeds = ["TLC seed and fingerprint index 0."], oracle = "TLC exhausts the safety configuration including incumbent preservation during retained-stage retry and detects the publication mutations." }

[[obligation]]
id = "P-003"
requirement_ids = ["R-015", "R-017", "R-320"]
source = "src/transaction.rs"
symbols = ["CopySession::apply", "CopyPhase"]
assumptions = ["The caller reports only established identity, quiescence, data and journal barriers, verification, metadata and sealing observations.", "The coordinator gives each new attempt a unique binding."]
gates = ["rust", "tlc"]
rust = { test = "tlc_early_publication_counterexample_stops_before_namespace_effect", file = "tests/transaction.rs", oracle = "The Rust trace rejects publication intent before the reported stage is verified and sealed." }
tlc = { spec = "verification/tla/CopyRecovery.tla", config = "verification/tla/CopyRecovery.cfg", negative_control = "verification/tla/CopyRecoveryEarlyPublication.cfg", model_bounds = ["One entry and target name, two source views, one crash and one retained-stage recovery epoch."], seeds = ["TLC seed and fingerprint index 0."], oracle = "TLC exhausts the safety configuration and rejects both early publication and an unverified retained-stage retry through PriorPublicationEvidence." }

[[obligation]]
id = "P-004"
requirement_ids = ["R-018", "R-176", "R-178", "R-179", "R-181", "R-319", "R-321"]
source = "src/range.rs"
symbols = ["checked_range_end"]
assumptions = ["The proof covers one positive write range. Allocation, partition and permit ownership have separate obligations.", "Charon and Aeneas preserve the semantics of the selected Rust operations and the pinned scalar models."]
gates = ["rust", "lean", "kani"]
rust = { test = "checked_ranges_agree_with_wide_integer_arithmetic", file = "tests/range.rs", seeds = ["ChaCha 0x4558_4143_5241_4E47, 1024 cases and persisted regressions."], oracle = "Compare the executable result with a wider integer oracle for contained half-open ranges." }
lean = { theorem = "ExaCopy.Proofs.checked_range_end_spec", proof = "verification/Proofs/Range.lean", generated = "verification/Generated/Funs.lean", axioms_tcb = ["propext", "Classical.choice", "Quot.sound", "Lean 4.31.0 kernel", "Pinned Charon, Aeneas and hax scalar models."], oracle = "Regenerate Lean from the actual Rust function, check the exact mathematical specification in the kernel and verify the theorem's axiom dependencies." }
kani = { harness = "kani_checks::range::checked_range_end_matches_wide_arithmetic", file = "verification/kani/range.rs", unwind_bound = 1, model_bounds = ["Full Cartesian product of three u64 inputs with no harness assumptions."], oracle = "Prove equivalence to the wider integer oracle and reach all six guard-behavior covers with unwinding assertions enabled." }

[[obligation]]
id = "P-041"
requirement_ids = ["R-269", "R-270"]
source = "src/sync.rs"
symbols = ["classify_two_way_path"]
assumptions = ["One fixed endpoint pair, raw path and policy with truthful complete, unavailable or unsupported observations.", "The abstract matching receipt binds the side, scan generation and observed evidence. Receipt authenticity and retention are supplied assumptions.", "Rust replay links only the finite classifier subjects to implementation. Baseline admission and generation advancement exist solely in the TLA+ model."]
gates = ["rust", "tlc"]
rust = { test = "sync_classifier_matches_all_tlc_subjects", file = "tests/sync_tlc.rs", oracle = "Compare the public Rust classifier with all 432 distinct rows from the independently modeled TLA+ decision matrix, including content-only and required-metadata-only differences." }
tlc = { spec = "verification/tla/SyncBaseline.tla", config = "verification/tla/SyncBaseline.cfg", negative_control = "verification/tla/SyncBaselineTreatUnknownAsAbsent.cfg", model_bounds = ["One path, two fixed endpoints, 432 initial classifier subjects, one scan at generation 1, one competing generation advance and at most one receipt per endpoint."], seeds = ["TLC seed and fingerprint index 0."], oracle = "Exhaust all reachable states and require an exact 432-row table match. Require complete, known observations and paired matching receipts for modeled baseline admission at the current predecessor, and detect unknown-as-absence, receipt bypass and stale-generation controls." }

[[obligation]]
id = "P-053"
requirement_ids = ["R-269", "R-270"]
source = "src/sync_genesis.rs"
symbols = ["admit"]
assumptions = [
    "One exact subject at two selected, ordered roots. Caller-supplied identities and scope/policy projections faithfully describe the admitted native observations.",
    "Both reads independently verify complete supported regular files, EOF and required metadata. Completion and recheck positions are truthful and monotonic within the current scan.",
    "Native identity, lease, measurement and artifact persistence are separate obligations. This result contains observation evidence and has no effect authority.",
]
gates = ["rust"]
rust = { file = "tests/sync_genesis.rs", test = "genesis_matches_independent_bounded_observation_oracle", oracle = "The independent defect oracle accepts only complete matched pairs in a finite product of 16 reported-fault axes and both read orders (131072 cases, two healthy). Accepted outputs retain the ordered observations and exact selection." }

[[obligation]]
id = "P-057"
requirement_ids = ["R-253"]
source = "src/retained_prefix.rs"
symbols = ["Continuation::begin", "Continuation::permit_tail", "Continuation::checkpoint", "Continuation::complete_tail"]
assumptions = [
    "The live capability owner truthfully reports exact retained stage, active exclusive lease, approved scope and fresh source. Quiescence and old history classification are independently confirmed.",
    "Fresh prefix comparison, independent historical digests, actual stage extent, prefix and chunk barriers and canonical durable journal successors and genuinely reserved closeout and receipt capacity are verified by their native and storage owners before they are reported.",
    "One serialized coordinator owns the admitted stage. A rejected or uncertain execution must reconcile outside this pure model. The model grants no filesystem, publication or recovery authority by itself.",
]
gates = ["rust", "tlc"]
rust = { file = "tests/retained_prefix.rs", test = "retained_prefix_requires_ordered_evidence_and_exact_tail_completions", oracle = "Tails are refused before the verified prefix barrier and durable continuation. Two exact contiguous tracked chunks proceed only through a confirmed intermediate checkpoint. Overlapping or unbounded ranges refuse." }
tlc = { spec = "verification/tla/RetainedPrefix.tla", config = "verification/tla/RetainedPrefix.cfg", negative_control = "verification/tla/RetainedPrefixEarlyPermit.cfg", seeds = ["TLC seed and fingerprint index 0."], model_bounds = ["One retained unit, zero or two tail units, one old writer, two source labels, one continuing lineage, four capacity states and journal ends bounded by 8."], oracle = "Model exhausts both tail completions through a durable checkpoint without accepting prefix overwrite, post-intent/unknown history or a stale scope, source or head. Eight negative controls exercise early permit, overwrite, missing checkpoint, lost context, stale source, stale head, nonsticky ambiguous completion, and omitted closeout capacity." }
