
# cargo-vet audits file

[[audits.aead]]
who = "OpenAI Codex (automated dependency source review)"
criteria = "safe-to-deploy"
version = "0.6.1"
notes = """
2026-11-27. Reviewed the complete crates.io archive SHA-256
1973cfbc1a2daf9cf550e74e1f088c28e7f7d8c1e1418fb6c9dc5184b7e84c99,
matching Cargo.lock and the cached crates.io index. The archive identifies
upstream revision 3d2d90045bffc402af4edb6a5a4dbb1e217329d1.

Reviewed prefix and postfix tag assembly and parsing, detached buffer
forwarding, allocation and fixed-capacity adapters, the deprecated forwarding
trait, optional RNG re-exports, and development helpers and tests. The library
forbids unsafe code and the archive has no build script, proc macro, native
code, or target-specific implementation. The dev macros consume explicit
test fixtures and may print test vectors on failures.

The adapters assume coherent Buffer lengths and successful capacity changes.
In-place failures can leave the buffer modified. Postfix encryption mutates
the message before trying to append its tag. Prefix encryption reserves tag
space first, then rearranges the buffer before invoking the cipher. Nonces
are supplied by callers and must be fresh for each encryption. Concrete
ciphers supply tag verification and determine output on decryption failure.
RNG implementations, cryptographic algorithms, timing and zeroization
remain outside this exact-package source review. No compilation or execution.
"""

