[[audits.cfg_aliases]]
who = "OpenAI Codex (dependency source review)"
criteria = "safe-to-deploy"
version = "0.2.2"
notes = """
2026-11-26. Reviewed the complete locked registry archive SHA-256
f079e83a288787bcd14a6aea84cee5c87a67c5a3e660c30f557a3d24761b3527.
The edition-2018 crate declares no features, dependencies or build script.
Its declarative macro reads Cargo cfg and feature variables and the PROFILE
fallback for debug assertions, with no environment writes, filesystem
access, network access, subprocesses, unsafe code or native linkage. It
prints only rustc-check-cfg and conditional rustc-cfg instructions with
alias names drawn from caller-source identifiers. Environment values affect
boolean selection and are never printed. Non-feature option operands are
caller expressions and may be evaluated once per visited value.

Callers must trust their build environment and supply valid, acyclic
configuration. Invalid or cyclic input can exhaust the compiler's macro
recursion limit. The PROFILE fallback is a heuristic, and missing or
non-Unicode options are treated as empty in the equality path. Nix 0.31.4
is the sole locked consumer, using build-time literal target_os checks
and finite OR combinations. The packaged test and doctest paths were
reviewed by inspection.

Selected execution on native macOS ARM64 with Rust 1.100.0 passed.
A build-script-shaped fixture checked declared aliases and their exact emitted
Boolean selections with synthetic Linux, macOS, and Windows Cargo environments.
"""

