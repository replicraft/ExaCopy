[[audits.serde]]
who = "OpenAI Codex (automated dependency source review)"
criteria = "safe-to-deploy"
version = "1.0.229"
notes = """
2026-11-25. Reviewed registry archive SHA-256
4148590afebada386688f18773da617792bf2ef03ffc1e4cbd2b1d45b023e0ba.
All packaged source files, including the docs.rs copy of serde_core, match
upstream commit 7fc3b4c30c94f73a96ebd1553f2b090d928fc3a8, identified by the
upstream v1.0.229 release whose signature GitHub marks verified.

The usual build re-exports serde_core and optionally serde_derive. The two
unchecked UTF-8 conversions in the packaged docs.rs copy are identical to the
reviewed core conversions. The build script probes Cargo's selected rustc with
--version, emits cfgs, and writes a fixed module template containing the Cargo
package patch number to private.rs under OUT_DIR. The inputs belong to the
trusted build environment. Reviewed runtime private visitors and serializers
used by derives, including the map key/value contract and buffering for
flattened, tagged, and untagged forms. Allocation and retries depend on values,
formats, and application schemas. Caller-supplied codecs and hooks supply their
own resource and side-effect behavior. Optional alloc, rc, and unstable paths
forward to core. The CLI uses typed JSON report serialization with flattening,
tags, explicit field names, and omitted fields. The engineering xtask also
uses deserialization to validate evidence and TOML contracts.

The exact-source upstream suite passed 404 tests on macOS ARM64 with Rust
1.100.0. Stable checks passed for no-default, alloc+derive, alloc+rc+derive
without std, and default+rc+derive. At ExaCopy 0d402ce, 12 CLI tests and 37
xtask tests passed on the same host. Native Linux and Windows execution was
outside this review.
"""

[[audits.serde_core]]
who = "OpenAI Codex (automated dependency source review)"
criteria = "safe-to-deploy"
version = "1.0.229"
notes = """
2026-11-25. Reviewed registry archive SHA-256
67dca2c9c51e58a4791a4b1ed58308b39c64224d349a935ab5039aa360942a48.
All packaged source files match upstream commit
7fc3b4c30c94f73a96ebd1553f2b090d928fc3a8 from the v1.0.229 release.

Reviewed both unsafe sites. The formatter's private Buf exposes only the
initialized prefix copied from complete &str fragments, with capacity checks.
Its callers format bounded standard integer errors or network address values.
The IPv4 fast path writes ASCII digits and separators into a 15-byte buffer
and converts only the populated prefix. Its octet formatter has an exhaustive
upstream byte test. Reviewed the std value and synchronization integrations.
Paths, C strings, IP/port values and times use value conversions, not ambient
filesystem or network operations. Locking uses the caller's Mutex or RwLock
and reports poison as an error. The rc feature serializes pointed-to values
and does not preserve sharing or break cycles. The optional unstable feature
adds never-type handling. The result feature adds the Result implementations.
Collection readers cap size-hint preallocation at 1 MiB, then consume actual
values. In-place readers may update destinations before a later error, as
allowed by their contract. The build script probes trusted Cargo RUSTC and
writes the generated versioned shim under OUT_DIR.

ExaCopy selects std+result through serde and serde_json. Exact-source tests
covered Serde's annotations, standard type conversions and error handling in
the macOS ARM64 Rust 1.100.0 upstream suite. The no-default and alloc/rc
combinations also compiled. This evidence is host-scoped.
"""

[[audits.serde_derive]]
who = "OpenAI Codex (automated dependency source review)"
criteria = "safe-to-deploy"
version = "1.0.229"
notes = """
2026-11-25. Reviewed registry archive SHA-256
e7a5d71263a5a7d47b41f6b3f06ba276f10cc18b0931f1799f710578e2309348.
All packaged source files match upstream commit
7fc3b4c30c94f73a96ebd1553f2b090d928fc3a8 from the v1.0.229 release.

This source-only proc macro has no build script, precompiled executable,
unsafe blocks, or ambient I/O. It parses trusted derive inputs with Syn and
uses thread::panicking only to avoid an error-context destructor panic while
unwinding. Reviewed the Syn 3 source delta and emission paths for structs,
tagged and untagged enum forms, versioned private helper calls, default and
custom hooks, generics, and optional deserialize_in_place. Emitted code uses
safe trait calls. Generated visitors implement field and variant dispatch and
apply source attributes for duplicate and unknown keys, borrowing, and hooks.
The optional in-place generator takes a mutable reference and may update
fields before returning an error. Untagged variants can retry against a
buffered value. Schema authors choose recursion, tags, defaults, and custom
callbacks. Build-only diagnostics and resource use depend on trusted source
shape. The ExaCopy CLI uses serialization derives for reports. Its xtask also
uses deserialization derives for evidence and contracts.

macOS ARM64 upstream tests used the locked proc-macro2 1.0.107, quote 1.0.47,
and syn 3.0.10 versions. The Rust 1.100.0 upstream suite passed 404 tests with
its deserialize_in_place feature. On nightly 2026-11-04, 116 UI cases matched
and two required-trait cases differed in diagnostic text while still failing
to compile with E0277. These are recorded snapshot failures. The separate
nightly runtime lane with unstable enabled passed 408 tests. No other
target's macro host or runtime was executed in this review.
"""

