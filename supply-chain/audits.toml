[[audits.constant_time_eq]]
who = "OpenAI Codex (dependency source review)"
criteria = "safe-to-deploy"
version = "0.4.2"
notes = """
2026-11-25. Reviewed the locked registry archive SHA-256
3d52eff69cd5e647efe296129160853a42795992097e8af39800e1060caeea9b.
Reviewed checked loads, target feature selection, inline assembly, and thread
DIT restoration in all shipped implementation modules. The unsafe DIT override
requires truthful CPU feature promises. Benchmark-only classic code and generic
black_box are best-effort timing barriers. no_std ARM depends on target features
or the documented unsafe override. The forced-DIT-off no_std unit expectation
fails because the test detects runtime hardware independently of the no_std path.
Native ARM64 and translated x86-64 equality checks passed on Rust 1.100.0.
ExaCopy reaches this version through BLAKE3 digest equality. This audit does not
qualify side-channel behavior for secret inputs across compilers and hardware.
"""

[[audits.crc32c]]
who = "OpenAI Codex (dependency source review)"
criteria = "safe-to-deploy"
version = "0.6.9"
notes = """
2026-11-25. Reviewed the locked registry archive SHA-256
7f132a176423ee852e8f0a35d43088d1850966b50745be818a88b76f64b1c6cb.
Packaged source matches upstream commit 3098a6edd7b1cb28198e3048889907b7160043e4.
Runtime CRC and SSE 4.2 detection gate the respective intrinsics. Reviewed whole
three-lane chunks, table indices, aligned shared slice construction, empty
slices, integer endianness and the software fallback. The alignment calculation
assumes slice addresses leave room for adding seven. The I/O wrappers rely on
their caller-supplied reader and writer count contracts. The build script uses
the configured compiler version probe and generates fixed tables in Cargo's
OUT_DIR. The compiler and build directory are trusted. Rust 1.100.0 differential
checks passed on macOS ARM64, translated x86-64 and the direct software path.
ExaCopy uses slice APIs on bounded journal frames for corruption detection.
"""

[[audits.crypto-common]]
who = "OpenAI Codex (dependency source review)"
criteria = "safe-to-deploy"
version = "0.1.7"
notes = """
2026-11-25. Reviewed the locked registry archive SHA-256
78c8292055d1c1df0cce5d180393dc8cce0abec0a7102adb6c7b1eef6016d60a.
The library forbids unsafe code and has no build script. Type-level sizes fix
block, output, key and IV lengths. Default slice constructors check exact
length before conversion and blanket constructors delegate to the inner type.
Optional random key and IV helpers fill fixed-size buffers through a generator
supplied by the caller. The getrandom feature exposes rand_core's OS generator.
The caller owns entropy, key handling and nonce policy. The std feature adds
an error trait implementation. Exact-archive Apple ARM64 integration checks
covered key and IV lengths and SHA-2 with and without std. ExaCopy uses no
crypto-common features through digest. Upstream Git equivalence is unverified.
"""

[[audits.digest]]
who = "OpenAI Codex (dependency source review)"
criteria = "safe-to-deploy"
version = "0.10.7"
notes = """
2026-11-25. Reviewed the locked registry archive SHA-256
9ed9a281f7bc9b7576e61468ba615a66a5c8cfdff42420a70aa82701a3b1e292.
The library forbids unsafe code and has no build script. Reviewed fixed and
variable output lengths, block and XOF delegation, reset, and the optional
alloc, std, MAC, RNG, OID and test macro paths. The std adapters consume or
fill in-memory slices. The dev macros include caller-selected local test
fixtures at compilation and may print fixture bytes on failure. Boxed XOF
callers must bound requested output sizes and truncated MAC callers must
independently enforce the protocol's expected tag length. SHA-2 known answers,
streaming and reset, invalid output lengths and XOF integration checks passed
on Apple ARM64, with and without std. ExaCopy selects the default core-api
path without alloc or std for production. Upstream Git equivalence is unverified.
"""

