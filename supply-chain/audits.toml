[[audits.syn]]
who = "OpenAI Codex (dependency source review)"
criteria = "safe-to-deploy"
version = "3.0.10"
notes = """
2026-11-25. Reviewed the locked registry archive SHA-256
4ae9ccbea3a7b0b09443036490c8f34a8b1b760fd345e5c0dae0aac718faea79.
The archive names commit 97ec37dda8a893a460066da694fd1eb7cb30538a,
corroborated by the signed upstream 3.0.10 release.

Reviewed token buffer offsets and scope sentinels, cursor lifetime
erasure, speculative parsing, single-span token layout conversions,
and thread-bound diagnostic spans. Cursors borrow immutable boxed
storage with internally constructed offsets and end sentinels.
ParseStream::step brands its cursor through an invariant higher-ranked
closure parameter, and Speculative::advance_to checks the scope
before storing a fork cursor. The static Sync entry is an empty
sentinel. ThreadBound only exposes its payload on the creating thread
and permits cross-thread copies for Copy payloads. Single-span
punctuation and WithSpan use transparent layouts over the same span.

There is no build script. Parsing and optional printing and traversal
operate on caller-supplied Rust tokens, with syntax or trailing tokens
reported as errors. Recursion depth and resource limits for processing
untrusted source are caller responsibilities. The release includes
upstream PR 2090, which avoids repeated scanning of the same operands
during full expression printing.

With Rust 1.100.0 aarch64 macOS, an isolated harness passed 28 packaged
parse-buffer, parse-stream, punctuation, and identifier tests with full,
extra-traits, fold, visit, and visit-mut enabled. Focused tests covered
valid and malformed derive input and Serde's compiler-backed expansion
at the selected product feature union. The full upstream runner
requires offline dev inputs that were unavailable.
"""

