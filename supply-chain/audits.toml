[[audits.version_check]]
who = "OpenAI Codex (dependency source review)"
criteria = "safe-to-deploy"
version = "0.9.5"
notes = """
2026-11-25. Reviewed the locked registry archive SHA-256
0b928f33d975fc6ad9f86c8f283853ad26bdd5b10b7f1542aa2fa15e2289105a.
The registry archive names the corroborated upstream release commit. The probe
uses the configured RUSTC or PATH compiler with fixed version-query arguments.
It inherits the build environment, trusts UTF-8 stdout even after a nonzero
exit, and imposes no child timeout. The compiler and build host must be trusted.
ExaCopy uses this only in generic-array's build script to select a conversion
implementation. Rust 1.100.0 tests, doctests and isolated compiler probes passed.
The released archive omits the historical sample fixtures. There is no unsafe
code, native linkage, network access, or direct file mutation.
"""
