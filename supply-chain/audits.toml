[[audits.uuid]]
who = "OpenAI Codex (dependency source review)"
criteria = "safe-to-deploy"
version = "1.29.3"
notes = """
2026-11-25. Reviewed the locked registry archive SHA-256
3c14b15dffa2f4bd712103e857140aa04a4f2ff6e955c77d7eb8e53ee02a3b64.
The archive identifies commit 266c044a9cd9845de011251525f45a6bee341774,
corroborated by the upstream v1.29.3 release. The package has no build
script or executable payload. Its exported literal macro performs a
compile-time parse.

Reviewed the shipped representation, parse and format paths and optional
feature code. Uuid and its formatting wrappers are transparent over a
16-byte array. The braced format conversion uses a padding-free C layout
of byte fields. Formatting copies between disjoint equally sized slices,
fully initializes the selected prefix to ASCII, and then borrows it as
UTF-8. Unchecked non-nil constructors receive UUIDs with nonzero version
bits. Text decoding and its diagnostic scan are bounded to 45 bytes.
Borsh and byte-layout derives apply to the transparent byte wrapper.
Serde, arbitrary, and slog adapters use caller-provided inputs and
serializers. The optional Serde byte-sequence visitor stores 16 bytes and
drains any remaining elements to report invalid length. Streaming callers
need their ordinary serialized-input limits.

Optional v1 and v6 generation encodes caller node IDs and timestamps.
ContextV1 uses a native atomic or a non-Sync Cell, and the shared std v7
context protects its counter and clock state with a mutex. Ambient access
is limited to documented clock and entropy APIs, including the wasm Date
