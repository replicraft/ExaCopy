code, dependency, or ambient runtime I/O. Intended timing behavior is best effort. Machine timing
was outside the review.

Selected execution on native macOS ARM64 with Rust 1.100.0 passed.
An alloc-enabled control covered lower and upper round-trips across all 256
byte values, output canaries, and the allocating lowercase encoder.
"""

