[[audits.unicode-ident]]
who = "OpenAI Codex (dependency source review)"
criteria = "safe-to-deploy"
version = "1.0.27"
notes = """
2026-11-25. Reviewed the locked registry archive SHA-256
a2c754d6c33795a1c324727428e5a7dedb5b06195f9890bdbcba760d3e246563.
The archive identifies the upstream 1.0.27 release commit. This featureless
no_std library has no build script, allocation or runtime I/O. Its two
unchecked leaf loads follow checked trie lookups with valid all-zero fallback
chunks. The static data bounds the largest possible offsets to 5215 and 8063
in an 8064-byte leaf table. The arithmetic remains in bounds on 16-bit usize,
where truncating the scalar can misclassify supplementary characters. On
Rust 1.100.0 Apple ARM64, both properties matched Unicode 18.0.0 UCD data for
all 1112064 valid scalars. The archive ships the tables as Rust constants.
The upstream generation tool is outside the package, and the package's CI
configuration is outside Cargo's dependency build.
"""

[[audits.uuid]]
who = "OpenAI Codex (dependency source review)"
criteria = "safe-to-deploy"
version = "1.29.3"
notes = """
2026-11-25. Reviewed the locked registry archive SHA-256
3c14b15dffa2f4bd712103e857140aa04a4f2ff6e955c77d7eb8e53ee02a3b64.
The archive identifies commit 266c044a9cd9845de011251525f45a6bee341774,
corroborated by the upstream v1.29.3 release. The package has no build
script or executable payload. Its exported literal macro performs a
compile-time parse.

Reviewed the shipped representation, parse and format paths and optional
feature code. Uuid and its formatting wrappers are transparent over a
16-byte array. The braced format conversion uses a padding-free C layout
of byte fields. Formatting copies between disjoint equally sized slices,
fully initializes the selected prefix to ASCII, and then borrows it as
UTF-8. Unchecked non-nil constructors receive UUIDs with nonzero version
bits. Text decoding and its diagnostic scan are bounded to 45 bytes.
Borsh and byte-layout derives apply to the transparent byte wrapper.
Serde, arbitrary, and slog adapters use caller-provided inputs and
serializers. The optional Serde byte-sequence visitor stores 16 bytes and
drains any remaining elements to report invalid length. Streaming callers
need their ordinary serialized-input limits.

Optional v1 and v6 generation encodes caller node IDs and timestamps.
ContextV1 uses a native atomic or a non-Sync Cell, and the shared std v7
context protects its counter and clock state with a mutex. Ambient access
is limited to documented clock and entropy APIs, including the wasm Date
and Web Crypto imports, with fixed-size randomness requests. Generation
can panic or throw if its entropy or host clock service is unavailable.
V3 and v5 use MD5 and SHA-1 for standardized name-derived identifiers.
Those identifiers carry no authentication guarantee.

Rust 1.100.0 aarch64 macOS passed 60 packaged feature-free tests and 112
packaged tests using a standalone manifest over the exact archive source
with std, arbitrary, versions 1 and 3 through 8, and the native getrandom
backend. Two focused Serde boundary tests passed, covering text and byte
round trips, short and long sequences, and rejection of nil for
NonNilUuid. The full upstream Clippy and test runners were blocked during
offline dependency resolution. Remaining optional target and dependency
configurations were examined by source inspection. ExaCopy's production
graph uses the feature-free byte representation and formatting.
"""

