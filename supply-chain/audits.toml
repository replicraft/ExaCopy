[[audits.proc-macro2]]
who = "OpenAI Codex (dependency source review)"
criteria = "safe-to-deploy"
version = "1.0.107"
notes = """
2026-11-25. Reviewed the locked registry archive SHA-256
985e7ec9bb745e6ce6535b544d84d6cd6f7ad8bd711c398938ae983b91a766d9.
The archive names commit ed8a5497669cd63db33bf24646f261b012bbbc4a,
corroborated by the signed upstream 1.0.107 release.

Reviewed the fallback and compiler-backed lexer, token stream, literal
and span paths. The fallback ownership read consumes the RcVec once
because the source is wrapped in ManuallyDrop. Public unchecked literal
construction requires valid Rust literal syntax. Safe lexical APIs
validate tokens, and compiler bridge conversions use checked parsing
or internally rendered Rust tokens and escaped literals. Fallback
group scanning and destruction use explicit stacks. Recursive rendering
and optional thread-local source maps consume resources according to
input depth and retained source. Long-running consumers of fallback
span locations can explicitly invalidate the thread's spans between
independent jobs. Compiler spans expose source text and path data
provided by the compiler.

The build script calls trusted RUSTC and optionally configured wrappers
with Cargo-supplied flags and packaged compile probes. It emits metadata
and removes its probe subdirectory under Cargo's OUT_DIR. No probe
binary is executed. The compiler, wrappers and build-directory
configuration are trusted build inputs.

On Rust 1.100.0 aarch64 macOS, a standalone harness passed 41 packaged
token tests at default features and 50 packaged token, comment and
span tests with span-locations enabled. Compiling the exact Serde derive
against this archive exercised compiler-backed expansion. The full
upstream runner was blocked by offline dependency resolution. Unstable
compiler paths were reviewed in source.
"""

