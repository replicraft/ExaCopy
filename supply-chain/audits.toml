ExaCopy uses slice APIs on bounded journal frames for corruption detection.
"""

[[audits.crypto-common]]
who = "OpenAI Codex (dependency source review)"
criteria = "safe-to-deploy"
version = "0.1.7"
notes = """
2026-11-25. Reviewed the locked registry archive SHA-256
78c8292055d1c1df0cce5d180393dc8cce0abec0a7102adb6c7b1eef6016d60a.
The library forbids unsafe code and has no build script. Type-level sizes fix
block, output, key and IV lengths. Default slice constructors check exact
length before conversion and blanket constructors delegate to the inner type.
Optional random key and IV helpers fill fixed-size buffers through a generator
supplied by the caller. The getrandom feature exposes rand_core's OS generator.
The caller owns entropy, key handling and nonce policy. The std feature adds
an error trait implementation. Exact-archive Apple ARM64 integration checks
covered key and IV lengths and SHA-2 with and without std. ExaCopy uses no
crypto-common features through digest. Upstream Git equivalence is unverified.
"""

