Packaged source matches upstream commit 3098a6edd7b1cb28198e3048889907b7160043e4.
Runtime CRC and SSE 4.2 detection gate the respective intrinsics. Reviewed whole
three-lane chunks, table indices, aligned shared slice construction, empty
slices, integer endianness and the software fallback. The alignment calculation
