[[audits.unicode-ident]]
who = "OpenAI Codex (dependency source review)"
criteria = "safe-to-deploy"
version = "1.0.27"
notes = """
2026-11-25. Reviewed the locked registry archive SHA-256
a2c754d6c33795a1c324727428e5a7dedb5b06195f9890bdbcba760d3e246563.
The archive identifies the upstream 1.0.27 release commit. This featureless
no_std library has no build script, allocation or runtime I/O. Its two
unchecked leaf loads follow checked trie lookups with valid all-zero fallback
chunks. The static data bounds the largest possible offsets to 5215 and 8063
in an 8064-byte leaf table. The arithmetic remains in bounds on 16-bit usize,
where truncating the scalar can misclassify supplementary characters. On
Rust 1.100.0 Apple ARM64, both properties matched Unicode 18.0.0 UCD data for
all 1112064 valid scalars. The archive ships the tables as Rust constants.
The upstream generation tool is outside the package, and the package's CI
configuration is outside Cargo's dependency build.
"""

