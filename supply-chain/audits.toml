[[audits.pin-project-lite]]
who = "OpenAI Codex (dependency source review)"
criteria = "safe-to-deploy"
version = "0.2.18"
notes = """
2026-11-25. Reviewed the locked registry archive SHA-256
c938015719552d665fd0553b90d96cd7ff58e83e4c061ca99e6bb78865a72752.
Its VCS metadata identifies upstream release commit
281af7d8b23d1a87c30f32af73b1596703f29d5f. This dependency-free no_std
library has no build script. Its macro emits structural field projections.
Reviewed pinned-field Unpin bounds and conflicting Drop checks, including
unsized types, packed-field rejection by the compiler, and replacement
guards that move only unpinned fields and drop pinned fields before
overwriting the old value on return or unwind. The pinned compiler and
private macro helpers are part of the soundness boundary. Native tests on
Rust 1.100.0 and nightly Miri each passed 21 tests. Twelve native doctests
and four targeted compile rejections passed. The packaged full runner
lacks macrotest and trybuild. ExaCopy's locked UUID WebAssembly chain
includes this crate without activating it in the workspace feature graph.
"""

