[[audits.base16ct]]
who = "OpenAI Codex (automated dependency source review)"
criteria = "safe-to-deploy"
version = "1.0.0"
notes = """
2026-11-26. Reviewed the exact locked registry archive SHA-256
fd307490d624467aa6f74b0eabb77633d1f758a7b25f12bceb0b22e08d9726f6.
Reviewed all source paths with and without alloc. The four unchecked UTF-8
conversions receive only the fully written output of the lower and upper
encoders. Valid byte-slice lengths can be doubled in usize. The encoders
check destination capacity and write two ASCII hex digits per input byte.
Decoders check even length and output capacity, scan all pairs, and return
an error for invalid digits after writing the output prefix. Allocating
helpers scale with the caller's input length and need caller input limits.
