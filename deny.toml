[graph]
# Include test dependencies and every target-specific dependency in the locked graph.
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
include-dev = true
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]
exceptions = [
    { crate = "boringtun@0.7.1", allow = ["BSD-3-Clause"] },
    { crate = "curve25519-dalek@4.1.3", allow = ["BSD-3-Clause"] },
    { crate = "curve25519-dalek@5.0.0", allow = ["BSD-3-Clause"] },
    { crate = "ed25519-dalek@3.0.0", allow = ["BSD-3-Clause"] },
    { crate = "ip_network@0.4.1", allow = ["BSD-2-Clause"] },
    { crate = "ip_network_table@0.2.0", allow = ["BSD-2-Clause"] },
    { crate = "managed@0.8.0", allow = ["0BSD"] },
    { crate = "minicbor@2.3.1", allow = ["BlueOak-1.0.0"] },
    { crate = "ring@0.17.14", allow = ["ISC"] },
    { crate = "smoltcp@0.14.0", allow = ["0BSD"] },
    { crate = "subtle@2.6.1", allow = ["BSD-3-Clause"] },
    { crate = "untrusted@0.9.0", allow = ["ISC"] },
    { crate = "x25519-dalek@2.0.1", allow = ["BSD-3-Clause"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
