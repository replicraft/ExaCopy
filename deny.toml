[graph]
# Include test dependencies and every target-specific dependency in the locked graph.
all-features = true

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = []
yanked = "deny"
unmaintained = "all"
unsound = "all"

[licenses]
include-dev = true
allow = [
    "Apache-2.0",
    "MIT",
    "Unicode-3.0",
]
exceptions = [
    { crate = "curve25519-dalek@4.1.3", allow = ["BSD-3-Clause"] },
    { crate = "ed25519-dalek@2.2.0", allow = ["BSD-3-Clause"] },
    { crate = "minicbor@2.3.0", allow = ["BlueOak-1.0.0"] },
    { crate = "subtle@2.6.1", allow = ["BSD-3-Clause"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
