[package]
name = "exacopy-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
experimental-linux-public-apply = []
experimental-linux-managed-sync = ["exacopy-platform?/experimental-linux-managed-sync"]
experimental-ssh-capture = [
	"dep:exacopy-sftp",
	"dep:exacopy-ssh",
	"dep:exacopy-transfer",
	"dep:tokio",
	"exacopy-sftp/experimental-sftp",
	"exacopy-ssh/experimental-ssh",
]
experimental-ssh-wireguard = [
	"experimental-ssh-capture",
	"dep:base64ct",
	"dep:exacopy-wireguard",
	"exacopy-wireguard?/experimental-udp",
	"exacopy-wireguard?/experimental-tcp",
]
experimental-verified-prefix-resume = ["experimental-ssh-capture"]
experimental-apfs-copy = ["dep:ed25519-dalek", "dep:exacopy-content", "dep:exacopy-journal", "dep:exacopy-model", "dep:exacopy-transfer", "exacopy-transfer/experimental-apfs-copy"]
experimental-windows-diff = ["dep:exacopy-diff", "dep:exacopy-endpoint", "dep:exacopy-platform", "exacopy-platform/experimental-windows-read"]
experimental-windows-bootstrap-inspect = [
	"dep:ed25519-dalek",
	"dep:exacopy-journal",
	"dep:exacopy-platform",
	"exacopy-platform/experimental-windows-read",
	"exacopy-platform/experimental-windows-copy",
]

windows-bootstrap-fixture = [
	"dep:exacopy-journal",
	"dep:exacopy-platform",
	"exacopy-platform/experimental-windows-read",
	"exacopy-platform/experimental-windows-copy",
]

[[bin]]
name = "exacopy"
path = "src/main.rs"

[[test]]
name = "linux_managed_sync_production"
path = "tests/linux_managed_sync_production.rs"
required-features = ["experimental-linux-managed-sync"]

[[test]]
name = "linux_managed_sync_genesis_production"
path = "tests/linux_managed_sync_genesis_production.rs"
required-features = ["experimental-linux-managed-sync"]

[[test]]
name = "windows_bootstrap"
path = "tests/windows_bootstrap.rs"
required-features = ["windows-bootstrap-fixture"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
exacopy-sftp = { workspace = true, optional = true }
exacopy-ssh = { workspace = true, optional = true }
exacopy-diff.workspace = true
exacopy-endpoint.workspace = true
exacopy-platform.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
exacopy-manifest.workspace = true
exacopy-plan.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
exacopy-content.workspace = true
exacopy-model.workspace = true
exacopy-journal.workspace = true
exacopy-transfer.workspace = true
rustix.workspace = true
base64ct = { workspace = true, optional = true }
exacopy-wireguard = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
ed25519-dalek = { workspace = true, optional = true }
exacopy-diff = { workspace = true, optional = true }
exacopy-endpoint = { workspace = true, optional = true }
exacopy-journal = { workspace = true, optional = true }
exacopy-platform = { workspace = true, optional = true }

[target.'cfg(target_os = "windows")'.dev-dependencies]
ed25519-dalek.workspace = true

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
ed25519-dalek = { workspace = true, optional = true }
exacopy-content = { workspace = true, optional = true }
exacopy-journal = { workspace = true, optional = true }
exacopy-model = { workspace = true, optional = true }
exacopy-transfer = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
blake3.workspace = true
ed25519-dalek.workspace = true


[target.'cfg(target_os = "linux")'.dev-dependencies]
sha2.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dev-dependencies]
russh = { workspace = true, features = ["ring"] }
russh-sftp = { workspace = true, features = ["raw-string"] }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
zeroize.workspace = true
