[package]
name = "exacopy-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
experimental-apfs-copy = ["dep:exacopy-content", "dep:exacopy-journal", "dep:exacopy-model", "dep:exacopy-transfer", "exacopy-transfer/experimental-apfs-copy"]
experimental-windows-diff = ["dep:exacopy-diff", "dep:exacopy-endpoint", "dep:exacopy-platform", "exacopy-platform/experimental-windows-read"]

[[bin]]
name = "exacopy"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
exacopy-diff.workspace = true
exacopy-endpoint.workspace = true
exacopy-platform.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
exacopy-manifest.workspace = true
exacopy-plan.workspace = true
blake3.workspace = true
ed25519-dalek.workspace = true
exacopy-content.workspace = true
exacopy-model.workspace = true
exacopy-journal.workspace = true
exacopy-transfer.workspace = true
rustix = { workspace = true, features = ["rand"] }
uuid.workspace = true
zeroize.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
exacopy-diff = { workspace = true, optional = true }
exacopy-endpoint = { workspace = true, optional = true }
exacopy-platform = { workspace = true, optional = true }

[lints]
workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
exacopy-content = { workspace = true, optional = true }
exacopy-journal = { workspace = true, optional = true }
exacopy-model = { workspace = true, optional = true }
exacopy-transfer = { workspace = true, optional = true }

[target.'cfg(target_os = "macos")'.dev-dependencies]
blake3.workspace = true
ed25519-dalek.workspace = true
