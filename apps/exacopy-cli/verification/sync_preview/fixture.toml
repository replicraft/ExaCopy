schema_version = 1
id = "linux-sync-preview"
target = "x86_64-unknown-linux-gnu"
profile = "linux-unprivileged-tmpfs-sync-preview-v1"
rust_toolchain = "1.100.0"
runner = "verification/sync_preview/qualify.py"
controls = "verification/sync_preview/test_qualify.py"
workflow = ".github/workflows/linux-sync-preview-qualification.yml"
result = "result.json"

[[case]]
kind = "command"
selector = "equal"
source = "verification/sync_preview/qualify.py"
ignored = false

[[case]]
kind = "command"
selector = "same_extent_divergent"
source = "verification/sync_preview/qualify.py"
ignored = false

[[case]]
kind = "command"
selector = "metadata_divergent"
source = "verification/sync_preview/qualify.py"
ignored = false

[[case]]
kind = "command"
selector = "one_sided"
source = "verification/sync_preview/qualify.py"
ignored = false

[[case]]
kind = "command"
selector = "both_absent"
source = "verification/sync_preview/qualify.py"
ignored = false

[[case]]
kind = "command"
selector = "different_spelling"
source = "verification/sync_preview/qualify.py"
ignored = false

[[case]]
kind = "command"
selector = "unsupported_link"
source = "verification/sync_preview/qualify.py"
ignored = false

[[case]]
kind = "command"
selector = "aliased_files"
source = "verification/sync_preview/qualify.py"
ignored = false

[[case]]
kind = "command"
selector = "oversized"
source = "verification/sync_preview/qualify.py"
ignored = false

[[case]]
kind = "command"
selector = "directory_cap"
source = "verification/sync_preview/qualify.py"
ignored = false

[[case]]
kind = "command"
selector = "unavailable_root"
source = "verification/sync_preview/qualify.py"
ignored = false

[[case]]
kind = "command"
selector = "explicit_no_history_required"
source = "verification/sync_preview/qualify.py"
ignored = false

