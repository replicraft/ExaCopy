[workspace]
members = [
    "apps/exacopy-cli",
    "crates/formats/exacopy-manifest",
    "crates/formats/exacopy-plan",
    "crates/foundation/exacopy-model",
    "crates/foundation/exacopy-core",
    "crates/interfaces/exacopy-endpoint",
    "crates/platform/exacopy-platform",
    "crates/net/exacopy-ssh",
    "crates/adapters/exacopy-sftp",
    "crates/net/exacopy-wireguard",
    "crates/engines/exacopy-diff",
    "crates/engines/exacopy-transfer",
    "crates/storage/exacopy-content",
    "crates/storage/exacopy-journal",
    "crates/engineering/exacopy-testkit",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"

[workspace.dependencies]
# Internal crates
exacopy-ssh = { path = "crates/net/exacopy-ssh", version = "=0.1.0" }
exacopy-wireguard = { path = "crates/net/exacopy-wireguard", version = "=0.1.0" }
exacopy-sftp = { path = "crates/adapters/exacopy-sftp", version = "=0.1.0" }
exacopy-core = { path = "crates/foundation/exacopy-core", version = "=0.1.0" }
exacopy-manifest = { path = "crates/formats/exacopy-manifest", version = "=0.1.0" }
exacopy-plan = { path = "crates/formats/exacopy-plan", version = "=0.1.0" }
exacopy-content = { path = "crates/storage/exacopy-content", version = "=0.1.0" }
exacopy-diff = { path = "crates/engines/exacopy-diff", version = "=0.1.0" }
exacopy-endpoint = { path = "crates/interfaces/exacopy-endpoint", version = "=0.1.0" }
exacopy-journal = { path = "crates/storage/exacopy-journal", version = "=0.1.0" }
exacopy-model = { path = "crates/foundation/exacopy-model", version = "=0.1.0" }
exacopy-platform = { path = "crates/platform/exacopy-platform", version = "=0.1.0" }
exacopy-transfer = { path = "crates/engines/exacopy-transfer", version = "=0.1.0" }

# Public codec
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
base64ct = { version = "=1.8.3", default-features = false }
jiff = { version = "=1.0.3", default-features = false }

# Experimental network protocol
boringtun = { version = "=0.7.1", path = "../local-deps/boringtun", default-features = false }
bytes = { version = "=1.12.1", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
sha1 = { version = "=0.11.0", default-features = false }
russh = { version = "=0.65.4", path = "../local-deps/russh", default-features = false }
russh-sftp = { version = "=4.0.0", default-features = false }
smoltcp = { version = "=0.14.0", default-features = false }
tokio = { version = "=1.54.1", default-features = false }
tokio-util = { version = "=0.7.20", default-features = false }

# Integrity and framing
blake3 = { version = "=1.8.7", default-features = false }
crc32c = "=0.6.9"
ed25519-dalek = { version = "=3.0.0", default-features = false, features = ["zeroize"] }
minicbor = { version = "=2.3.1", default-features = false }
zeroize = { version = "=1.9.2", default-features = false }

# Domain identifiers
uuid = { version = "1.29", default-features = false }

# Native platform adapters
apfs-mounted = { version = "=0.1.0", path = "../pomologie/apfs/crates/platform/apfs-mounted", default-features = false }
getrandom = { version = "=0.4.3", default-features = false, features = ["std"] }
libc = "=0.2.191"
nix = { version = "=0.31.4", default-features = false }
rustix = { version = "1.1.6", features = ["fs", "process"] }
windows-sys = { version = "=0.61.2", default-features = false }

# Command-line parsing
clap = { version = "=4.6.10", default-features = false, features = ["std", "help", "usage", "error-context"] }

# Engineering policy and evidence
cargo_metadata = "0.23"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
toml = "1"

# Test and verification
exacopy-testkit = { path = "crates/engineering/exacopy-testkit", version = "=0.1.0" }
hax-lib = { version = "=0.4.2", default-features = false, features = ["macros"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
overflow-checks = true

[patch.crates-io]
russh-util = { version = "=0.52.0", path = "../local-deps/russh-util" }
