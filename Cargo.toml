[workspace]
members = [
    "crates/clients/cli",
    "crates/core/codec",
    "crates/core/model",
    "crates/endpoints/endpoint",
    "crates/endpoints/platform",
    "crates/operations/diff",
    "crates/operations/transfer",
    "crates/runtime/engine",
    "crates/storage/content",
    "crates/storage/journal",
    "crates/engineering/exacopy-testkit",
    "xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
license = "Apache-2.0"

[workspace.dependencies]
# Internal crates
exacopy-codec = { path = "crates/core/codec", version = "=0.1.0" }
exacopy-content = { path = "crates/storage/content", version = "=0.1.0" }
exacopy-diff = { path = "crates/operations/diff", version = "=0.1.0" }
exacopy-endpoint = { path = "crates/endpoints/endpoint", version = "=0.1.0" }
exacopy-engine = { path = "crates/runtime/engine", version = "=0.1.0" }
exacopy-journal = { path = "crates/storage/journal", version = "=0.1.0" }
exacopy-model = { path = "crates/core/model", version = "=0.1.0" }
exacopy-platform = { path = "crates/endpoints/platform", version = "=0.1.0" }
exacopy-transfer = { path = "crates/operations/transfer", version = "=0.1.0" }

# Public codec
base64 = { version = "=0.23.1", default-features = false, features = ["alloc"] }
chrono = { version = "=0.4.45", default-features = false, features = ["alloc"] }

# Integrity and framing
blake3 = { version = "=1.8.7", default-features = false }
crc32c = "=0.6.9"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["zeroize"] }
minicbor = { version = "=2.3.1", default-features = false }
zeroize = { version = "=1.9.2", default-features = false }

# Domain identifiers
uuid = { version = "1.29", default-features = false }

# Native platform adapters
apfs-mounted = { version = "=0.1.0", path = "../pomologie/apfs/crates/platform/apfs-mounted", default-features = false }
getrandom = { version = "=0.4.3", default-features = false, features = ["std"] }
libc = "=0.2.191"
rustix = { version = "1.1.6", features = ["fs", "process"] }
windows-sys = { version = "=0.61.2", default-features = false }

# Command-line parsing
clap = { version = "=4.6.10", default-features = false, features = ["std", "help", "usage", "error-context"] }

# Engineering policy and evidence
cargo_metadata = "0.23"
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "visit"] }
toml = "1"

# Test and verification
exacopy-testkit = { path = "crates/engineering/exacopy-testkit", version = "=0.1.0" }
hax-lib = { version = "=0.4.2", default-features = false, features = ["macros"] }
proptest = { version = "1.12", default-features = false, features = ["std"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"

[profile.release]
overflow-checks = true
