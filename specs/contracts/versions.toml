[[contract]]
id = "linux-remote-download-resolved-direct-owner"
kind = "transfer_journal"
status = "implemented_private"
version = "1.1"
required_features = 3
owner = "crates/storage/exacopy-journal/src/remote_download/owner.rs"
notes = "Mandatory account-relative owner profile for resolved direct SSH. The canonical SSH authority and host-key pin bind an exact authorized IP address and port under a distinct scope digest domain. Readers require explicit profile selection."

[[contract]]
id = "linux-remote-download-records"
kind = "transfer_journal"
status = "implemented_private"
version = "1.0"
required_features = 1
owner = "crates/storage/exacopy-journal/src/remote_download/records/wire.rs"
notes = "Private kinds 1, 2, 3, 15 and 37. Kind 37 precedes exclusive creation of a fresh private stage. Replay must separately authenticate scope, resolve earlier references and establish actual evidence."

[[contract]]
id = "linux-remote-stage-directory-bootstrap"
kind = "transfer_journal"
status = "implemented_private"
version = "1"
owner = "crates/storage/exacopy-journal/src/remote_download/bootstrap.rs"
notes = "Private frame kind 38 authenticates the fixed stage directory under a separate signing domain, the selected owner profile and the exact first JobPrepared head. Required before allocations in the explicitly selected strict profile. Historical replay refuses this new kind."

[[contract]]
id = "linux-remote-download-finalization"
kind = "transfer_journal"
status = "implemented_private"
version = "1.0"
required_features = 3
owner = "crates/storage/exacopy-journal/src/remote_download/finalization/wire.rs"
notes = "Remote-only kinds 4–9 and 18 for the explicit SFTP unnamed-stream policy. Structural declarations require separate authoritative replay and native qualification."

[[contract]]
id = "linux-remote-capture-retirement"
kind = "transfer_journal"
status = "implemented_private"
version = "1.0"
required_features = 7
owner = "crates/storage/exacopy-journal/src/remote_download/retirement/wire.rs"
notes = "Private kind 39 retires a sealed pre-intent capture while preserving the old stage. The 1024-byte reader checks exact authenticated scope, current predecessor and retained stage identities. Read-only history conveys no native or grant authority."

[[contract]]
id = "linux-remote-destination-qualification"
kind = "transfer_journal"
status = "implemented_private"
version = "1"
owner = "crates/storage/exacopy-journal/src/remote_download/qualification/wire.rs"
notes = "Bounded signed destination attestation with separate attestor role, signature and record digest domains. Requires independently selected tested build, route profile class, complete campaign evidence and exact current destination facts."

[[contract]]
