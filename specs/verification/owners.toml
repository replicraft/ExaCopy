schema_version = 1

# Each package owns verification/obligations.toml and verification/check.sh.
# These are the minimum gate kinds for that owner. The crate-local ledger
# owns individual obligations and their source, harness and oracle links.
[owners]
exacopy-cli = ["rust"]
exacopy-core = ["kani"]
exacopy-diff = ["rust", "tlc"]
exacopy-endpoint = ["kani"]
exacopy-journal = ["rust"]
exacopy-manifest = ["rust"]
exacopy-model = ["rust", "lean", "kani", "tlc"]
exacopy-plan = ["rust"]
exacopy-platform = ["tlc"]
exacopy-transfer = ["rust"]
exacopy-wireguard = ["rust"]

# Native fixtures have platform-specific execution and do not add generic gates.
[native_fixtures]
exacopy-cli = [
	"verification/sync_preview/fixture.toml",
	"verification/managed_sync_production/fixture.toml",
	"verification/managed_sync_genesis_production/fixture.toml",
	"verification/public_stage_ext4/fixture.toml",
]
exacopy-platform = [
	"verification/protected_slot/fixture.toml",
	"verification/protected_root_setup/fixture.toml",
	"verification/sync_history_ext4/fixture.toml",
	"verification/sync_history_ext4_statmount/fixture.toml",
	"verification/witnessed_components_ext4/fixture.toml",
	"verification/windows_ntfs_publication/fixture.toml",
	"verification/windows_ntfs_publication_preparation/fixture.toml",
]
