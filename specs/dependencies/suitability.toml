unsafe_exposure = "No build script. The core processes 64-byte blocks with a software implementation or unsafe CPU intrinsics for AArch64 or x86 SHA instructions. Default dispatch checks the required CPU features through cpufeatures before entering accelerated code and falls back to software. Other architecture and explicit backend configurations remain outside the selected runtime evidence."
