[assessment."nix@0.31.4"]
archive_sha256 = "2bc81ce8148d3b4f3274da811f11cdd824ae661ee4ef732cdb229825cf5be7f7"
release_observation = "The exact locked archive was reviewed only for the Linux exacopy-platform feature=feature uname call path."
security_history = "The recorded inventory and the local source review do not replace an advisory or full-package audit."
unsafe_exposure = "src/sys/utsname.rs uses a zero-initialized libc::utsname, checks libc::uname through Errno::result before output access, and reinterprets bounded c_char array slices as bytes. build.rs configures target aliases. ExaCopy does not add Linux unsafe code."
resource_limits = "The selected Linux uname call uses one fixed stack buffer. Field conversion stops at NUL or the array length. The adapter separately bounds and cross-checks procfs fields and the exact mount row."
adversarial_inputs = "uname syscall failure becomes a typed kernel I/O refusal before qualification or dependent effects. Procfs observations and authenticated evidence must independently match."
verification = "Linux-target Clippy compiles typed EPERM and ENOSYS refusal fixtures. Native execution and accepted filesystem qualification are separate."
replacement = "An equivalent fallible uname binding must check the kernel return before reading fixed output and preserve bounded exact bytes and errno."
review_gaps = ["Independent selected uname ABI and behavior review on native x86-64 and AArch64 Linux", "Optional transport feature paths and complete Cargo Vet review remain outside this scoped assessment"]

