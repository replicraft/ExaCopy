archive_sha256 = "d3fb67a6e08acf24fdeccbac2cb6ac4305825bd1f117462e0e6f2f193345ad56"
release_observation = "Local crates.io index lists 0.7.8 on 2026-07-02 after 0.7.7 on 2026-06-20. The upstream release adjusts test selection on 32-bit targets."
security_history = "No package advisory in the recorded RustSec snapshot. The upstream changelog records a zero-sized element double-free fix in 0.7.7, included in the locked release."
unsafe_exposure = "ArrayVec uses MaybeUninit and raw pointer operations to maintain an initialized prefix, including during unwind. ArrayString additionally maintains UTF-8. BLAKE3 uses safe APIs with all arrayvec features disabled. The package has no build script, native linkage or platform I/O."
resource_limits = "BLAKE3 uses inline capacity for the chaining-value stack, SIMD batches of chunk and parent references, and a 64-byte hexadecimal digest buffer. Capacity comes from fixed constants. The length uses u16 on 16-bit targets and u32 elsewhere."
adversarial_inputs = "Arbitrary file bytes affect BLAKE3 state and digest values. Hash tree depth and batching determine capacity requirements, and the hex buffer receives encoded ASCII. Panicking insertion methods rely on the caller maintaining those bounds."
verification = "The existing source review records macOS ARM64 tests without default features, all-feature Miri tests with the exhaustive UTF-8 test run natively, and Linux GNU and Windows MSVC x86_64 compile checks. ExaCopy content tests exercise digest and stream-boundary behavior."
replacement = "BLAKE3 would need equivalent bounded storage, insertion and iteration semantics. Recheck digest vectors, tree boundaries and inline memory cost if its storage implementation changes."
review_gaps = ["Native target qualification of BLAKE3's selected backends remains separate. Revisit optional codec portability and the 16-bit length representation if the supported graph expands."]

