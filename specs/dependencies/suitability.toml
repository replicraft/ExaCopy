# The locked archive identifies upstream commit 5e7cd5733536844a9856dc7259bd4696bbe5e3ae.
[assessment."getrandom@0.4.3"]
archive_sha256 = "300e883d756b2e4ec94e02791f39b04b522276138852cfc41d9fb7e904106099"
release_observation = "The packaged upstream changelog dates 0.4.3 to 2026-06-17 and records WebAssembly backend changes. The manifest declares MIT OR Apache-2.0 and Rust 1.85."
security_history = "No getrandom advisory in the recorded RustSec snapshot."
unsafe_exposure = "The selected macOS backend calls libc getentropy with an exclusive mutable buffer and checks the return value. The shared fill wrapper validates complete initialization before returning success. build.rs reads Cargo's sanitizer cfg to select MemorySanitizer support."
resource_limits = "ExaCopy supplies a stack-allocated 12-byte buffer. The macOS backend uses one getentropy call for this size and allocates no heap storage on success."
adversarial_inputs = "Callers supply no external bytes to the random source. A failed call discards the prefix and prevents exclusive stage creation. A nonrepeating process-local serial remains part of every successful identity."
verification = "Native platform fixtures exercise successful stage creation, attempt identity separation and refusal before effects on injected entropy failure. Source review confirms the default macOS backend and that std error conversion preserves system errno."
replacement = "Use an equivalent fallible system entropy API and preserve the 12-byte prefix, serial encoding, and refusal before creation."
review_gaps = ["Independent exact-version review against the workspace Cargo Vet criterion", "Qualify the selected backend for every supported macOS release profile"]

