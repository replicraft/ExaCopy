name: ExaCopy v0.1.0 testing recovery

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exacopy-v0-1-0-testing-recovery
  cancel-in-progress: false

defaults:
  run:
    shell: bash
    working-directory: source

env:
  PYTHON_VERSION: "3.14.7"
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  RELEASE_TAG: refs/tags/v0.1.0
  RELEASE_COMMIT: 104451ebfeeb344418ece53ad020e7cbafa72054
  ORIGINAL_RUN: "45879576710"
  EXPECTED_RUST_HOST: x86_64-unknown-linux-gnu

jobs:
  linux-native:
    name: Run the full frozen release-default workspace suite on Ubuntu 24.04
    if: github.repository == 'replicraft/ExaCopy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v0.1.0
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Bind the clean tag checkout and observe the fixture mounts
        run: |
          test "$(git -C ../controller rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse --verify "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          source_status=$(git status --porcelain=v1 --untracked-files=all)
          test -z "$source_status"
          bash .github/ci/capture.sh testing-source python -B ../controller/.github/ci/release_testing_recovery.py check-source --source "$PWD"
          bash .github/ci/capture.sh testing-mounts bash -euo pipefail -c '
            uname -srm
            test "$(id -u)" -ne 0
            for fixture in / /tmp /dev/shm /proc; do
              stat -f -c "filesystem=%T magic=%t path=%n" "$fixture"
              findmnt --raw --noheadings --target "$fixture" --output TARGET,FSTYPE,FSROOT,VFS-OPTIONS
            done
            stat -Lc "procfs_root_inode=%i" /proc
            readlink /proc/thread-self/ns/mnt
            test "$(findmnt --raw --noheadings --target /dev/shm --output FSTYPE,FSROOT)" = "tmpfs /"
          '
      - name: Prepare the pinned sources, Rust and nextest
        run: |
          bash .github/ci/capture.sh release-apfs python -B tools/apfs_source.py --fetch
          bash .github/ci/capture.sh transport-source python -B tools/transport_source.py --fetch
          bash .github/ci/capture.sh release-rust bash .github/ci/install.sh rust
          bash .github/ci/capture.sh release-nextest-setup bash .github/ci/install.sh nextest
      - name: Run every frozen release-default workspace test
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/exacopy-release-tests
        run: |
          bash .github/ci/capture.sh release-nextest cargo +1.100.0 nextest run \
            --locked --release --workspace --no-default-features --profile ci-release --no-tests fail
          test -s target/nextest/ci-release/junit.xml
      - name: Retain the native suite and environment observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: testing-recovery-linux-native-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exacopy-evidence/
            source/target/nextest/ci-release/junit.xml
          if-no-files-found: error

  linux-build:
    name: Build and start the frozen GNU CLI on Ubuntu 22.04
    needs: linux-native
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: controller
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v0.1.0
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify the controller and frozen source
        run: |
          test "$(git -C ../controller rev-parse HEAD)" = "$GITHUB_WORKFLOW_SHA"
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse --verify "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          source_status=$(git status --porcelain=v1 --untracked-files=all)
          test -z "$source_status"
          bash .github/ci/capture.sh testing-source python -B ../controller/.github/ci/release_testing_recovery.py check-source --source "$PWD"
          bash .github/ci/capture.sh testing-mounts bash -euo pipefail -c '
            uname -srm
            for fixture in / /tmp /dev/shm /proc; do
              stat -f -c "filesystem=%T magic=%t path=%n" "$fixture"
              findmnt --raw --noheadings --target "$fixture" --output TARGET,FSTYPE,FSROOT,VFS-OPTIONS
            done
            stat -Lc "procfs_root_inode=%i" /proc
            readlink /proc/thread-self/ns/mnt
          '
      - name: Prepare pinned sources, Rust and feature isolation
        run: |
          bash .github/ci/capture.sh release-apfs python -B tools/apfs_source.py --fetch
          bash .github/ci/capture.sh transport-source python -B tools/transport_source.py --fetch
          bash .github/ci/capture.sh release-rust bash .github/ci/install.sh rust
          bash .github/ci/capture.sh release-features python -B tools/feature_matrix.py --target "$EXPECTED_RUST_HOST"
      - name: Build the x86-64 GNU CLI and archive its exact bytes
        run: |
          bash .github/ci/capture.sh testing-build python -u -B ../controller/.github/ci/release_testing_recovery.py build-linux \
            --source "$PWD" --output "$RUNNER_TEMP/exacopy-release"
      - name: Retain the GNU ABI and build evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-native-evidence-x86_64-unknown-linux-gnu-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exacopy-evidence/
            ${{ runner.temp }}/exacopy-release/build/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-fixture-archive-x86_64-unknown-linux-gnu-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-release/fixture/
          compression-level: 0
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-fixture-trust-x86_64-unknown-linux-gnu-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-release/fixture-trust/
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-unsigned-x86_64-unknown-linux-gnu-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exacopy-release/unsigned-cli/
            ${{ runner.temp }}/exacopy-release/build/exacopy.cdx.json
            ${{ runner.temp }}/exacopy-release/build/build-provenance.json
          compression-level: 0
          if-no-files-found: error

  checksums:
    name: Checksum the exact three private fixture archives
    needs: linux-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v0.1.0
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Require the original successful macOS and Windows native jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse --verify "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN" --jq \
            '.id, .head_sha, .head_branch, .run_attempt, .workflow_id, .event, .status, .conclusion' > "$RUNNER_TEMP/original"
          printf '%s\n' "$ORIGINAL_RUN" "$RELEASE_COMMIT" v0.1.0 1 431408168 workflow_dispatch completed failure > "$RUNNER_TEMP/expected"
          cmp "$RUNNER_TEMP/original" "$RUNNER_TEMP/expected"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ORIGINAL_RUN/attempts/1/jobs" > "$RUNNER_TEMP/jobs.json"
          jq -e '
            .jobs | map(select(.status=="completed" and .conclusion=="success") | .name) | sort
              == ["Build and test candidate (aarch64-apple-darwin)", "Build and test candidate (x86_64-pc-windows-msvc)"]
          ' "$RUNNER_TEMP/jobs.json"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-fixture-archive-x86_64-unknown-linux-gnu-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-fixtures
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 45879576710
          name: release-fixture-archive-aarch64-apple-darwin-1
          path: ${{ runner.temp }}/exacopy-fixtures
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          github-token: ${{ github.token }}
          run-id: 45879576710
          name: release-fixture-archive-x86_64-pc-windows-msvc-1
          path: ${{ runner.temp }}/exacopy-fixtures
          digest-mismatch: error
      - name: Check package controls and generate exact fixture checksum index
        run: |
          python -B .github/ci/release_candidate_test.py -v
          python -B tools/release/package_test.py -v
          python -B tools/release/package.py checksums --artifact-dir "$RUNNER_TEMP/exacopy-fixtures"
          (cd "$RUNNER_TEMP/exacopy-fixtures" && sha256sum --strict -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-fixture-index-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-fixtures/
          if-no-files-found: error
          compression-level: 0

  interop:
    name: Verify recovered fixture archive on ${{ matrix.target }}
    needs: checksums
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            archive: exacopy-cli-x86_64-unknown-linux-gnu.tar.gz
          - os: macos-15
            target: aarch64-apple-darwin
            archive: exacopy-cli-aarch64-apple-darwin.tar.gz
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            archive: exacopy-cli-x86_64-pc-windows-msvc.zip
    env:
      EXPECTED_RUST_HOST: ${{ matrix.target }}
      FIXTURE_ARCHIVE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/v0.1.0
          fetch-depth: 0
          path: source
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Verify exact checked out release source
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git rev-parse --verify "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-fixture-index-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-fixtures
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: runner.os == 'Linux'
        with:
          name: release-fixture-trust-x86_64-unknown-linux-gnu-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-fixture-trust
          digest-mismatch: error
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: runner.os != 'Linux'
        with:
          github-token: ${{ github.token }}
          run-id: 45879576710
          name: release-fixture-trust-${{ matrix.target }}-1
          path: ${{ runner.temp }}/exacopy-fixture-trust
          digest-mismatch: error
      - name: Exercise POSIX fixture acquisition and installed launcher lifecycle
        if: runner.os != 'Windows'
        run: |
          pin=$(cat "$RUNNER_TEMP/exacopy-fixture-trust/fixture-publisher.sha256")
          bash .github/ci/capture.sh release-latest-fixture python -B tools/installer/test_latest.py \
            --archive "$RUNNER_TEMP/exacopy-fixtures/$FIXTURE_ARCHIVE" \
            --checksum-index "$RUNNER_TEMP/exacopy-fixtures/SHA256SUMS.txt" \
            --publisher-cert "$RUNNER_TEMP/exacopy-fixture-trust/fixture-publisher.der" \
            --publisher-sha256 "$pin" --version 0.1.0
      - name: Exercise Linux product contracts and the native installer on the exact ABI-floor binary
        if: runner.os == 'Linux'
        run: |
          python -B tools/release/package.py extract --target "$EXPECTED_RUST_HOST" --version 0.1.0 \
            --archive "$RUNNER_TEMP/exacopy-fixtures/$FIXTURE_ARCHIVE" --bundle "$RUNNER_TEMP/exacopy-tested-bundle"
          bash .github/ci/capture.sh testing-cli-product python -B tools/contracts/check_cli.py "$RUNNER_TEMP/exacopy-tested-bundle/exacopy"
          bash .github/ci/capture.sh testing-cli-install python -B tools/installer/test_posix.py --artifact "$RUNNER_TEMP/exacopy-tested-bundle/exacopy"
      - name: Exercise Windows package verification and launcher lifecycle
        if: runner.os == 'Windows'
        run: |
          pin=$(cat "$RUNNER_TEMP/exacopy-fixture-trust/fixture-publisher.sha256")
          bash .github/ci/capture.sh release-latest-fixture pwsh -NoLogo -NoProfile -NonInteractive \
            -File .github/ci/release_windows_fixture.ps1 -Archive "$RUNNER_TEMP/exacopy-fixtures/$FIXTURE_ARCHIVE" \
            -Index "$RUNNER_TEMP/exacopy-fixtures/SHA256SUMS.txt" \
            -Certificate "$RUNNER_TEMP/exacopy-fixture-trust/fixture-publisher.der" \
            -PublisherSha256 "$pin" -Version 0.1.0
      - name: Retain archive interoperability results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-fixture-results-${{ matrix.target }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-evidence/
          if-no-files-found: error
