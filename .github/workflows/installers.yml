name: Offline CLI installer fixtures

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  fixture:
    name: Offline CLI installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            executable: exacopy
          - os: macos-15
            target: aarch64-apple-darwin
            executable: exacopy
          - os: windows-2025
            target: x86_64-pc-windows-msvc
            executable: exacopy.exe
    env:
      EXPECTED_RUST_HOST: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check clean source and fixture runtime
        run: |
          bash .github/ci/capture.sh installer-environment bash .github/ci/installer-evidence.sh environment
          printf 'CARGO_TARGET_DIR=%s\n' "$RUNNER_TEMP/exacopy-installer-target" >> "$GITHUB_ENV"
      - name: Provision pinned Pomologie APFS checkout
        run: |
          apfs_python=python3
          if [[ "$RUNNER_OS" == Windows ]]; then apfs_python=python; fi
          bash .github/ci/capture.sh installer-apfs-source "$apfs_python" -B tools/apfs_source.py --fetch
          bash .github/ci/capture.sh transport-source "$apfs_python" -B tools/transport_source.py --fetch
      - name: Install Rust 1.100.0
        run: bash .github/ci/capture.sh installer-rust-setup bash .github/ci/install.sh rust
      - name: Build a fresh locked CLI release-profile binary
        run: |
          bash .github/ci/capture.sh installer-build cargo +1.100.0 build --locked --release \
            -p exacopy-cli --bin exacopy
          bash .github/ci/capture.sh installer-artifact bash .github/ci/installer-evidence.sh artifact
      - name: Run POSIX install and uninstall fixtures
        id: posix
        if: runner.os != 'Windows'
        run: |
          bash .github/ci/capture.sh installer-posix python3 -u -B tools/installer/test_posix.py \
            --artifact "$CARGO_TARGET_DIR/release/exacopy"
      - name: Run PowerShell signed artifact and refusal fixtures
        id: windows
        if: runner.os == 'Windows'
        run: |
          bash .github/ci/capture.sh installer-windows pwsh -NoLogo -NoProfile -NonInteractive \
            -File tools/install/windows/test.ps1 -Artifact "$CARGO_TARGET_DIR/release/exacopy.exe"
      - name: Run latest-release and tar-padding fixtures
        id: posix_latest
        if: runner.os != 'Windows'
        run: |
          bash .github/ci/capture.sh installer-posix-latest python3 -u -B tools/installer/test_latest.py
      - name: Run standalone POSIX launcher lifecycle fixtures
        id: posix_launcher
        if: runner.os != 'Windows'
        run: |
          bash .github/ci/capture.sh installer-posix-launcher python3 -u -B tools/installer/test_posix_launcher.py
      - name: Run standalone PowerShell launcher construction fixtures
        id: windows_launcher
        if: runner.os == 'Windows'
        run: |
          bash .github/ci/capture.sh installer-windows-launcher pwsh -NoLogo -NoProfile -NonInteractive \
            -File tools/install/windows/launcher-fixture.ps1
      - name: Check release packaging and publication controls
        run: |
          release_python=python3
          if [[ "$RUNNER_OS" == Windows ]]; then release_python=python; fi
          bash .github/ci/capture.sh release-package-controls "$release_python" -u -B tools/release/package_test.py
          bash .github/ci/capture.sh release-registry-projection "$release_python" -u -B tools/release/registry_projection_test.py
          bash .github/ci/capture.sh release-publication-controls "$release_python" -u -B .github/ci/release_candidate_test.py
      - name: Retain installer evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-installer-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-evidence/
          if-no-files-found: error
          retention-days: 30
      - name: Retain failed fixture input
        if: >-
          ${{ !cancelled() && (steps.posix.outcome == 'failure' || steps.windows.outcome == 'failure' ||
          steps.posix_latest.outcome == 'failure' || steps.posix_launcher.outcome == 'failure' ||
          steps.windows_launcher.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: offline-installer-failed-input-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-installer-target/release/${{ matrix.executable }}
          if-no-files-found: error
          retention-days: 30
