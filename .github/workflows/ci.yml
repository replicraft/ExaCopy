name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  native:
    name: Native checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target
      EXPECTED_RUST_HOST: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - os: windows-2025
            target: x86_64-pc-windows-msvc
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision pinned Pomologie APFS checkout
        id: apfs
        shell: bash
        run: |
          apfs_python=python3
          if [[ "$RUNNER_OS" == Windows ]]; then apfs_python=python; fi
          bash .github/ci/capture.sh apfs-source "$apfs_python" -B tools/apfs_source.py --fetch
          bash .github/ci/capture.sh transport-source "$apfs_python" -B tools/transport_source.py --fetch
      - name: Install Rust 1.100.0
        id: rust
        run: bash .github/ci/capture.sh rust-setup bash .github/ci/install.sh rust
      - name: Check formatting
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: bash .github/ci/capture.sh fmt cargo +1.100.0 fmt --check
      - name: Install opt-in compiler cache
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && runner.os == 'Linux' && vars.EXACOPY_SCCACHE == '1' }}
        run: bash .github/ci/capture.sh sccache-setup bash .github/ci/install.sh sccache
      - name: Compile locked workspace
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        env:
          USE_EXACOPY_SCCACHE: ${{ runner.os == 'Linux' && vars.EXACOPY_SCCACHE == '1' }}
        run: |
          if [[ "$USE_EXACOPY_SCCACHE" == true ]]; then
            bash .github/ci/capture.sh build python3 -B tools/development/sccache.py --ci \
              --binary "$RUNNER_TEMP/exacopy-tools/sccache/sccache" -- build --locked --workspace --all-targets
          else
            bash .github/ci/capture.sh build cargo +1.100.0 build --locked --workspace --all-targets
          fi
      - name: Check Cargo feature and target matrix
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: |
          matrix_python=python3
          if [[ "$RUNNER_OS" == Windows ]]; then
            matrix_python=python
          fi
          bash .github/ci/capture.sh feature-matrix "$matrix_python" -B tools/feature_matrix.py --target "$EXPECTED_RUST_HOST"
      - name: Run Clippy
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: bash .github/ci/capture.sh clippy cargo +1.100.0 clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Check standalone Linux CLI feature profiles
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          bash .github/ci/capture.sh cli-default-profile cargo +1.100.0 clippy --locked \
            -p exacopy-cli --all-targets --no-default-features -- -D warnings
          for feature in experimental-ssh-capture experimental-ssh-wireguard experimental-verified-prefix-resume experimental-linux-public-apply; do
            bash .github/ci/capture.sh "cli-$feature-profile" cargo +1.100.0 clippy --locked \
              -p exacopy-cli --all-targets --no-default-features --features "$feature" -- -D warnings
          done
      - name: Install nextest
        id: nextest
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: bash .github/ci/capture.sh nextest-setup bash .github/ci/install.sh nextest
      - name: Run nextest
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' }}
        run: |
          report=target/nextest/ci/junit.xml
          rm -f -- "$report"
          bash .github/ci/capture.sh nextest cargo +1.100.0 nextest run --locked --workspace --profile ci --no-tests fail
          attendance_python=python3
          if [[ "$RUNNER_OS" == Windows ]]; then attendance_python=python; fi
          bash .github/ci/capture.sh apfs-default-cli-attendance \
            "$attendance_python" -B .github/ci/cli_opt_in_attendance.py apfs-default "$report"
          bash .github/ci/capture.sh windows-bootstrap-default-cli-attendance \
            "$attendance_python" -B .github/ci/cli_opt_in_attendance.py windows-bootstrap-default "$report"
      - name: Run in-process SSH tests
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' }}
        env:
          CARGO_TARGET_DIR: target/experimental-ssh
        run: |
          bash .github/ci/capture.sh experimental-ssh cargo +1.100.0 nextest run --locked \
            -p exacopy-ssh --features experimental-ssh --profile ci-experimental-ssh --no-tests fail
          test -s target/nextest/ci-experimental-ssh/junit.xml
      - name: Run opt-in WireGuard protocol, TCP and UDP loopback tests
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' }}
        env:
          CARGO_TARGET_DIR: target/experimental-wireguard
        run: |
          bash .github/ci/capture.sh experimental-wireguard cargo +1.100.0 nextest run --locked \
            -p exacopy-wireguard --lib --no-default-features --features experimental-udp,experimental-tcp \
            --profile ci-experimental-wireguard --no-tests fail
          test -s target/nextest/ci-experimental-wireguard/junit.xml
      - name: Run opt-in SFTP source adapter tests
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' && (runner.os == 'Linux' || runner.os == 'macOS') }}
        env:
          CARGO_TARGET_DIR: target/experimental-sftp
        run: |
          bash .github/ci/capture.sh experimental-sftp cargo +1.100.0 nextest run --locked \
            -p exacopy-sftp --features experimental-sftp --profile ci-experimental-sftp --no-tests fail \
            -E 'test(/^source::/)'
          test -s target/nextest/ci-experimental-sftp/junit.xml
      - name: Run opt-in held SFTP CLI capture tests
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' && (runner.os == 'Linux' || runner.os == 'macOS') }}
        env:
          CARGO_TARGET_DIR: target/experimental-ssh-capture
        run: |
          bash .github/ci/capture.sh experimental-ssh-capture cargo +1.100.0 nextest run --locked \
            -p exacopy-cli --features experimental-ssh-capture --profile ci-experimental-ssh-capture --no-tests fail \
            -E 'test(/^assembly::remote_ssh::tests::/)'
          test -s target/nextest/ci-experimental-ssh-capture/junit.xml
      - name: Run opt-in Linux CLI remote command and resume tests
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' && runner.os == 'Linux' }}
        env:
          CARGO_TARGET_DIR: target/experimental-ssh-wireguard
        run: |
          report=target/nextest/ci-experimental-ssh-wireguard/junit.xml
          rm -f -- "$report"
          bash .github/ci/capture.sh experimental-ssh-wireguard-cli cargo +1.100.0 nextest run --locked \
            -p exacopy-cli --lib --no-default-features --features experimental-ssh-wireguard \
            --profile ci-experimental-ssh-wireguard --no-tests fail \
            -E 'test(/^(args::parser::remote::|remote::|remote_(frontdoor|report)::|assembly::(remote_ssh::|ssh_session::|linux::remote_(download|journal|stage|continued)::))/)'
          bash .github/ci/capture.sh experimental-ssh-wireguard-cli-attendance \
            python3 -B .github/ci/cli_opt_in_attendance.py remote "$report"
      - name: Run opt-in first witnessed-prefix resume and inspection controls
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' && runner.os == 'Linux' }}
        env:
          CARGO_TARGET_DIR: target/experimental-verified-prefix-resume
        run: |
          report=target/nextest/ci-experimental-verified-prefix-resume/junit.xml
          rm -f -- "$report"
          bash .github/ci/capture.sh experimental-verified-prefix-resume-cli cargo +1.100.0 nextest run --locked \
            -p exacopy-cli --lib --no-default-features --features experimental-verified-prefix-resume,experimental-ssh-wireguard \
            --profile ci-experimental-verified-prefix-resume --no-tests fail \
            -E 'test(/^(args::parser::(remote|remote_inspect_witness)::|remote::|remote_(frontdoor|report|inspect_witness)::|witness_archive::|assembly::(remote_ssh::|ssh_session::|linux::remote_(download|journal|stage|continued|witness_authority)::))/)'
          bash .github/ci/capture.sh experimental-verified-prefix-resume-attendance \
            python3 -B .github/ci/cli_opt_in_attendance.py witnessed-resume "$report"
      - name: Run opt-in Linux CLI public-stage inspection tests
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' && runner.os == 'Linux' }}
        env:
          CARGO_TARGET_DIR: target/experimental-linux-public-apply
        run: |
          report=target/nextest/ci-experimental-linux-public-apply/junit.xml
          rm -f -- "$report"
          bash .github/ci/capture.sh experimental-linux-public-apply-cli cargo +1.100.0 nextest run --locked \
            -p exacopy-cli --lib --no-default-features --features experimental-linux-public-apply \
            --profile ci-experimental-linux-public-apply --no-tests fail \
            -E 'test(/^(args::parser::tests::|public_stage_inspect::tests::)/)'
          bash .github/ci/capture.sh experimental-linux-public-apply-cli-attendance \
            python3 -B .github/ci/cli_opt_in_attendance.py public-stage "$report"
      - name: Run opt-in Linux CLI public-stage command test
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' && runner.os == 'Linux' }}
        env:
          CARGO_TARGET_DIR: target/experimental-linux-public-apply
        run: |
          report=target/nextest/ci-experimental-linux-public-command/junit.xml
          rm -f -- "$report"
          bash .github/ci/capture.sh experimental-linux-public-command-cli cargo +1.100.0 nextest run --locked \
            -p exacopy-cli --test command --no-default-features --features experimental-linux-public-apply \
            --profile ci-experimental-linux-public-command --no-tests fail \
            -E 'test(/^public_stage_inspection_dispatch_refuses_without_a_valid_owner_key$/)'
          test -s "$report"
      - name: Run opt-in Linux managed sync recreate planning controls
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' && runner.os == 'Linux' }}
        env:
          CARGO_TARGET_DIR: target/experimental-linux-managed-sync
        run: |
          report=target/nextest/ci-experimental-linux-managed-sync/junit.xml
          rm -f -- "$report"
          bash .github/ci/capture.sh experimental-linux-managed-sync-cli cargo +1.100.0 nextest run --locked \
            -p exacopy-cli --lib --no-default-features --features experimental-linux-managed-sync \
            --profile ci-experimental-linux-managed-sync --no-tests fail \
            -E 'test(/^(args::parser::sync_managed::tests::prepare_recreate_|sync_preview::managed_command::recreate::tests::|assembly::linux::managed_sync::manual_recreate::tests::)/)'
          bash .github/ci/capture.sh experimental-linux-managed-sync-cli-attendance \
            python3 -B .github/ci/cli_opt_in_attendance.py managed-sync-recreate "$report"
      - name: Run P-071 Linux reservation fixture
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && runner.os == 'Linux' }}
        run: |
          bash .github/ci/capture.sh p071-native-reservation bash -euo pipefail -c '
            umask 077
            uname -srm
            id
            grep -E "^(CapInh|CapPrm|CapEff|CapBnd|CapAmb|NoNewPrivs|Seccomp):" /proc/self/status
            test "$(id -u)" -ne 0
            grep -Eq "^CapEff:[[:space:]]+0+$" /proc/self/status
            fixture=$(mktemp -d /dev/shm/exacopy-p071.XXXXXXXX)
            cleanup() { rm -rf -- "$fixture"; }; trap cleanup EXIT
            stat -f -c "fixture_fs=%T" "$fixture"
            test "$(stat -f -c %T "$fixture")" = tmpfs
            TMPDIR="$fixture" cargo +1.100.0 test --locked -p exacopy-platform --lib -- \
              linux::recovery::writer::witness_reservation::tests:: --include-ignored --test-threads=1 --show-output \
              | tee "$fixture/tests.log"
            python3 -B .github/ci/p071_attendance.py "$fixture/tests.log"
          '
      - name: Run opt-in managed APFS transfer tests
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' && runner.os == 'macOS' }}
        env:
          CARGO_TARGET_DIR: target/experimental-apfs-copy
        run: |
          report=target/nextest/ci-experimental-apfs-copy/junit.xml
          rm -f -- "$report"
          bash .github/ci/capture.sh experimental-apfs-copy cargo +1.100.0 nextest run --locked \
            -p exacopy-cli -p exacopy-transfer --features exacopy-cli/experimental-apfs-copy --profile ci-experimental-apfs-copy --no-tests fail
          bash .github/ci/capture.sh experimental-apfs-copy-cli-attendance \
            python3 -B .github/ci/cli_opt_in_attendance.py apfs-copy "$report"
      - name: Run opt-in Windows bootstrap inspection controls
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' && runner.os == 'Windows' }}
        env:
          CARGO_TARGET_DIR: target/experimental-windows-bootstrap-inspect
        run: |
          report=target/nextest/ci-experimental-windows-bootstrap-inspect/junit.xml
          rm -f -- "$report"
          bash .github/ci/capture.sh experimental-windows-bootstrap-inspect-cli cargo +1.100.0 nextest run --locked \
            -p exacopy-cli --lib --no-default-features --features experimental-windows-bootstrap-inspect \
            --profile ci-experimental-windows-bootstrap-inspect --no-tests fail \
            -E 'test(/^(args::parser::recovery::windows_bootstrap::tests::|windows_bootstrap_inspect::tests::)/)'
          bash .github/ci/capture.sh experimental-windows-bootstrap-inspect-cli-attendance \
            python -B .github/ci/cli_opt_in_attendance.py windows-bootstrap-inspect "$report"
      - name: Run opt-in Windows private creation descriptor controls
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' && runner.os == 'Windows' }}
        env:
          CARGO_TARGET_DIR: target/experimental-windows-bootstrap-inspect
        run: |
          profile=ci-experimental-windows-capture-descriptor
          report="target/nextest/$profile/junit.xml"
          run_descriptor_case() {
            local control="$1"
            local selector="$2"
            rm -f -- "$report"
            bash .github/ci/capture.sh "experimental-windows-capture-descriptor-$control" cargo +1.100.0 nextest run --locked \
              -p exacopy-platform --lib --no-default-features --features experimental-windows-copy,experimental-windows-read \
              --profile "$profile" --no-tests fail -E "test(/^$selector$/)"
            test -s "$report"
            mv -- "$report" "target/nextest/$profile/junit-$control.xml"
          }
          run_descriptor_case geometry windows::capture_creation::tests::creation_descriptor_bounds_every_sid_and_native_field
          run_descriptor_case private-acl windows::read::protected::acl::tests::creation_descriptor_satisfies_private_acl_for_only_selected_user
      - name: Run doctests
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: bash .github/ci/capture.sh doctest cargo +1.100.0 test --locked --workspace --all-features --doc
      - name: Retain native evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exacopy-evidence/
            target/nextest/ci/junit.xml
            target/nextest/ci-experimental-ssh/junit.xml
            target/nextest/ci-experimental-wireguard/junit.xml
            target/nextest/ci-experimental-sftp/junit.xml
            target/nextest/ci-experimental-ssh-capture/junit.xml
            target/nextest/ci-experimental-ssh-wireguard/junit.xml
            target/nextest/ci-experimental-verified-prefix-resume/junit.xml
            target/nextest/ci-experimental-linux-public-apply/junit.xml
            target/nextest/ci-experimental-linux-public-command/junit.xml
            target/nextest/ci-experimental-linux-managed-sync/junit.xml
            target/nextest/ci-experimental-apfs-copy/junit.xml
            target/nextest/ci-experimental-windows-bootstrap-inspect/junit.xml
            target/nextest/ci-experimental-windows-capture-descriptor/junit-geometry.xml
            target/nextest/ci-experimental-windows-capture-descriptor/junit-private-acl.xml
          if-no-files-found: error
          retention-days: 30

  hosted-remote-substrate:
    name: Hosted Linux destination diagnostics (unsigned)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 85
    env:
      EXPECTED_RUST_HOST: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact clean checkout
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && test -z "$(git status --porcelain)"
      - name: Prepare pinned source and tools
        run: |
          bash .github/ci/capture.sh apfs-source python3 -B tools/apfs_source.py --fetch
          bash .github/ci/capture.sh transport-source python3 -B tools/transport_source.py --fetch
          bash .github/ci/capture.sh rust-setup bash .github/ci/install.sh rust
          bash .github/ci/capture.sh locked-fetch cargo +1.100.0 fetch --locked
      - name: Probe native eligibility and collect kill diagnostics
        run: bash .github/ci/hosted_remote_substrate.sh
      - name: Retain hosted diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exacopy-linux-remote-push-substrate-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exacopy-evidence/
            ${{ runner.temp }}/exacopy-hosted-native-remote/diagnostic/
            ${{ runner.temp }}/exacopy-hosted-native-remote/cleanup-unconfirmed.txt
          if-no-files-found: error
          retention-days: 90

  policy:
    name: Engineering policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision pinned Pomologie APFS checkout
        id: apfs
        shell: bash
        run: |
          apfs_python=python3
          if [[ "$RUNNER_OS" == Windows ]]; then apfs_python=python; fi
          bash .github/ci/capture.sh apfs-source "$apfs_python" -B tools/apfs_source.py --fetch
          bash .github/ci/capture.sh transport-source "$apfs_python" -B tools/transport_source.py --fetch
      - name: Install Rust 1.100.0
        run: bash .github/ci/capture.sh rust-setup bash .github/ci/install.sh rust
      - name: Run engineering policy
        run: bash .github/ci/capture.sh policy cargo run --locked -p xtask -- check
      - name: Check emitted CLI contract versions
        if: ${{ !cancelled() && steps.apfs.outcome == 'success' }}
        run: |
          bash .github/ci/capture.sh contract-build cargo build --locked -p exacopy-cli
          bash .github/ci/capture.sh contract-runtime python3 -B tools/contracts/check_cli.py target/debug/exacopy
      - name: Run feature and SBOM policy controls
        if: ${{ !cancelled() }}
        run: |
          bash .github/ci/capture.sh build-policy-controls python3 -B -m unittest discover \
            -s tools -p '*_test.py'
      - name: Run CLI nextest attendance controls
        if: ${{ !cancelled() }}
        run: bash .github/ci/capture.sh cli-opt-in-attendance-controls python3 -B .github/ci/cli_opt_in_attendance_test.py -v
      - name: Run P-071 reservation attendance controls
        if: ${{ !cancelled() }}
        run: bash .github/ci/capture.sh p071-attendance-controls python3 -B .github/ci/p071_attendance_test.py -v
      - name: Run Linux remote qualification wrapper controls
        if: ${{ !cancelled() }}
        run: |
          bash .github/ci/capture.sh remote-qualification-controls python3 -B .github/ci/remote_qualification_test.py -v
          bash .github/ci/capture.sh remote-campaign-controls python3 -B -m unittest discover \
            -s apps/exacopy-cli/verification/remote -p 'test_*.py'
      - name: Check locked production dependency inventory
        if: ${{ !cancelled() && steps.apfs.outcome == 'success' }}
        run: bash .github/ci/capture.sh dependency-inventory python3 -B tools/dependency_review/check.py
      - name: Check independent reference and performance evidence
        if: ${{ !cancelled() }}
        run: bash .github/ci/capture.sh reference-evidence python3 -B tools/reference/check.py
      - name: Check requirements traceability
        if: ${{ !cancelled() }}
        run: bash .github/ci/capture.sh requirements python3 -B tools/requirements/check.py
      - name: Retain policy evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: policy-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-evidence/
          if-no-files-found: error
          retention-days: 30

  formal:
    name: Formal verification (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      EXPECTED_RUST_HOST: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision pinned Pomologie APFS checkout
        id: apfs
        shell: bash
        run: |
          apfs_python=python3
          if [[ "$RUNNER_OS" == Windows ]]; then apfs_python=python; fi
          bash .github/ci/capture.sh apfs-source "$apfs_python" -B tools/apfs_source.py --fetch
          bash .github/ci/capture.sh transport-source "$apfs_python" -B tools/transport_source.py --fetch
      - name: Set formal evidence paths
        run: printf 'EVS_RECORDS=%s/exacopy-evs\n' "$RUNNER_TEMP" >> "$GITHUB_ENV"
      - name: Install Rust 1.100.0
        id: rust
        run: bash .github/ci/capture.sh rust-setup bash .github/ci/install.sh rust
      - name: Install hax and elan
        id: lean
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: bash .github/ci/capture.sh lean-setup bash .github/ci/install.sh lean
      - name: Check extraction and Lean proof
        if: ${{ !cancelled() && steps.lean.outcome == 'success' }}
        run: bash .github/ci/capture.sh lean python3 tools/record_evidence.py "$EVS_RECORDS" --gate lean
      - name: Install Kani
        id: kani
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: bash .github/ci/capture.sh kani-setup bash .github/ci/install.sh kani
      - name: Run Kani harness
        if: ${{ !cancelled() && steps.kani.outcome == 'success' }}
        run: bash .github/ci/capture.sh kani python3 tools/record_evidence.py "$EVS_RECORDS" --gate kani
      - name: Install Java and TLC
        id: tlc
        if: ${{ !cancelled() && steps.rust.outcome != 'skipped' }}
        run: bash .github/ci/capture.sh tlc-setup bash .github/ci/install.sh tlc
      - name: Run TLC model and negative control
        if: ${{ !cancelled() && steps.tlc.outcome == 'success' }}
        run: bash .github/ci/capture.sh tlc python3 tools/record_evidence.py "$EVS_RECORDS" --gate tlc
      # Partial diagnostic snapshot before Rust obligations, Miri and final EVS validation.
      - name: Retain formal evidence through TLC
        if: ${{ !cancelled() && (steps.tlc.outcome == 'success' || steps.tlc.outcome == 'failure') }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tlc-snapshot-linux-x86_64-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exacopy-evs/
            ${{ runner.temp }}/exacopy-evidence/tlc-setup.log
            ${{ runner.temp }}/exacopy-evidence/tlc-setup.txt
            ${{ runner.temp }}/exacopy-evidence/tlc.log
            ${{ runner.temp }}/exacopy-evidence/tlc.txt
          if-no-files-found: error
          retention-days: 90
      - name: Install nextest for obligation tests
        id: nextest
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: bash .github/ci/capture.sh nextest-setup bash .github/ci/install.sh nextest
      - name: Record obligation tests
        if: ${{ !cancelled() && steps.nextest.outcome == 'success' }}
        run: bash .github/ci/capture.sh obligation-tests python3 tools/record_evidence.py "$EVS_RECORDS" --gate rust
      - name: Install Miri
        id: miri
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: bash .github/ci/capture.sh miri-setup bash .github/ci/install.sh miri
      - name: Run Miri
        if: ${{ !cancelled() && steps.miri.outcome == 'success' }}
        run: bash .github/ci/capture.sh miri bash crates/foundation/exacopy-model/verification/check.sh miri
      - name: Validate EVS records against current sources
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: bash .github/ci/capture.sh evs cargo run --locked -p xtask -- check-evidence "$EVS_RECORDS"
      - name: Retain formal evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formal-linux-x86_64-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exacopy-evidence/
            ${{ runner.temp }}/exacopy-evs/
          if-no-files-found: error
          retention-days: 90

  dependencies:
    name: Dependency policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision pinned Pomologie APFS checkout
        id: apfs
        shell: bash
        run: |
          apfs_python=python3
          if [[ "$RUNNER_OS" == Windows ]]; then apfs_python=python; fi
          bash .github/ci/capture.sh apfs-source "$apfs_python" -B tools/apfs_source.py --fetch
          bash .github/ci/capture.sh transport-source "$apfs_python" -B tools/transport_source.py --fetch
      - name: Install Rust 1.100.0
        id: rust
        run: bash .github/ci/capture.sh rust-setup bash .github/ci/install.sh rust
      - name: Install cargo-deny
        id: deny
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: bash .github/ci/capture.sh deny-setup bash .github/ci/install.sh deny
      - name: Check sources, licenses, bans, and advisories
        if: ${{ !cancelled() && steps.deny.outcome == 'success' }}
        run: bash .github/ci/capture.sh deny cargo deny --locked check
      - name: Install cargo-audit
        id: audit
        if: ${{ !cancelled() && steps.rust.outcome != 'skipped' }}
        run: bash .github/ci/capture.sh audit-setup bash .github/ci/install.sh audit
      - name: Audit the lockfile
        if: ${{ !cancelled() && steps.audit.outcome == 'success' }}
        run: bash .github/ci/capture.sh audit cargo audit --file Cargo.lock --deny warnings
      - name: Audit the pinned upstream transport bases
        if: ${{ !cancelled() && steps.audit.outcome == 'success' }}
        run: |
          base_lock="$RUNNER_TEMP/exacopy-evidence/transport-registry-base.lock"
          bash .github/ci/capture.sh transport-advisory-input python3 -B tools/transport_source.py --advisory-lock "$base_lock"
          bash .github/ci/capture.sh transport-base-audit cargo audit --file "$base_lock" --deny warnings
      - name: Install cargo-vet
        id: vet
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: bash .github/ci/capture.sh vet-setup bash .github/ci/install.sh vet
      - name: Check dependency audits
        if: ${{ !cancelled() && steps.vet.outcome == 'success' }}
        run: bash .github/ci/capture.sh vet cargo vet --locked
      - name: Retain dependency evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependencies-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-evidence/
          if-no-files-found: error
          retention-days: 30

  release-evidence:
    name: Unsigned CLI rebuild and SBOM (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_RUST_HOST: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision pinned Pomologie APFS checkout
        id: apfs
        shell: bash
        run: |
          apfs_python=python3
          if [[ "$RUNNER_OS" == Windows ]]; then apfs_python=python; fi
          bash .github/ci/capture.sh apfs-source "$apfs_python" -B tools/apfs_source.py --fetch
          bash .github/ci/capture.sh transport-source "$apfs_python" -B tools/transport_source.py --fetch
      - name: Install Rust 1.100.0
        run: bash .github/ci/capture.sh rust-setup bash .github/ci/install.sh rust
      - name: Rebuild from the archived source and inventory compiled crates
        run: |
          bash .github/ci/capture.sh release-rebuild python3 tools/sbom_release.py \
            --target "$EXPECTED_RUST_HOST" --fetch \
            --output "$RUNNER_TEMP/exacopy-evidence/unsigned-cli"
      - name: Retain release evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unsigned-cli-linux-x86_64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-evidence/
          if-no-files-found: error
          retention-days: 90

  scanners:
    name: Repository security scans
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: source
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        id: gitleaks
        run: bash .github/ci/capture.sh gitleaks-setup bash .github/ci/install.sh gitleaks
      - name: Scan repository history for secrets
        if: ${{ !cancelled() && steps.gitleaks.outcome == 'success' }}
        run: bash .github/ci/capture.sh gitleaks gitleaks git --redact=100 --no-banner --gitleaks-ignore-path .github/gitleaksignore .
      - name: Install Trivy
        id: trivy
        if: ${{ !cancelled() && steps.source.outcome == 'success' }}
        run: bash .github/ci/capture.sh trivy-setup bash .github/ci/install.sh trivy
      - name: Scan locked dependencies for vulnerabilities
        if: ${{ !cancelled() && steps.trivy.outcome == 'success' }}
        run: |
          report="$RUNNER_TEMP/exacopy-evidence/trivy.json"
          bash .github/ci/capture.sh trivy trivy fs --scanners vuln --no-progress --format json --output "$report" --exit-code 1 Cargo.lock
          jq -e 'any(.Results[]?; .Type == "cargo" and (.Packages | length > 0))' "$report"
      - name: Retain scanner evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-evidence/
          if-no-files-found: error
          retention-days: 30
