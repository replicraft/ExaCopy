name: Linux public-stage ext4 qualification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-public-stage-ext4-qualification.yml'
      - '.github/ci/common.sh'
      - '.github/ci/capture.sh'
      - '.github/ci/install.sh'
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/exacopy-cli/**'
      - 'crates/engines/exacopy-transfer/**'
      - 'crates/formats/exacopy-manifest/**'
      - 'crates/formats/exacopy-plan/**'
      - 'crates/foundation/exacopy-core/**'
      - 'crates/foundation/exacopy-model/**'
      - 'crates/interfaces/exacopy-endpoint/**'
      - 'crates/platform/exacopy-platform/**'
      - 'crates/storage/exacopy-content/**'
      - 'crates/storage/exacopy-journal/**'
      - 'specs/dependencies/**'
      - 'specs/verification/owners.toml'
      - 'tools/apfs_source.py'
      - 'tools/qualification/native_supervision.py'
      - 'tools/transport_source.py'
      - 'xtask/src/verification/native.rs'
      - 'xtask/src/verification/native/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  EXPECTED_RUST_HOST: x86_64-unknown-linux-gnu
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  qualify:
    if: github.repository == 'replicraft/ExaCopy' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm exact canonical native input
        id: admission
        run: |
          test "$GITHUB_SERVER_URL" = https://github.com
          test "${GITHUB_REPOSITORY,,}" = replicraft/exacopy
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          test "${GITHUB_WORKFLOW_REF,,}" = replicraft/exacopy/.github/workflows/linux-public-stage-ext4-qualification.yml@refs/heads/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain)"
          (umask 077; mkdir -- "$RUNNER_TEMP/exacopy-evidence")
      - name: Validate portable evidence controls
        run: |
          bash .github/ci/capture.sh public-stage-controls python3 -B -Werror \
            apps/exacopy-cli/verification/public_stage_ext4/test_runner.py -v
      - name: Prepare pinned build inputs
        run: |
          bash .github/ci/capture.sh public-stage-apfs python3 -B tools/apfs_source.py --fetch
          bash .github/ci/capture.sh public-stage-transport python3 -B tools/transport_source.py --fetch
          bash .github/ci/capture.sh public-stage-rust bash .github/ci/install.sh rust
          bash .github/ci/capture.sh public-stage-lock cargo +1.100.0 fetch --locked \
            --target "$EXPECTED_RUST_HOST"
      - name: Exercise the held public-stage fixture on whole ext4
        id: native
        run: |
          bash .github/ci/capture.sh public-stage-native python3 -B -Werror \
            apps/exacopy-cli/verification/public_stage_ext4/run.py --revision "$GITHUB_SHA" \
            --temporary-parent "$RUNNER_TEMP"
      - name: Retain exact native evidence
        if: always() && steps.native.outputs.evidence_path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-public-stage-ext4-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.native.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90
      - name: Retain workflow capture logs
        if: always() && steps.admission.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-public-stage-ext4-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-evidence/public-stage-*
          if-no-files-found: ignore
          retention-days: 90
