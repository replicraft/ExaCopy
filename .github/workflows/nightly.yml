name: Nightly assurance

on:
  schedule:
    - cron: '20 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  EXPECTED_RUST_HOST: x86_64-unknown-linux-gnu

jobs:
  coverage:
    name: Model and endpoint coverage (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.100.0
        run: bash .github/ci/capture.sh rust-setup bash .github/ci/install.sh rust
      - name: Install nextest
        run: bash .github/ci/capture.sh nextest-setup bash .github/ci/install.sh nextest
      - name: Install coverage tools
        id: coverage_tools
        run: bash .github/ci/capture.sh coverage-setup bash .github/ci/install.sh coverage
      - name: Require 95 percent line and 90 percent branch coverage
        timeout-minutes: 20
        run: bash .github/ci/capture.sh coverage bash .github/ci/assurance.sh coverage
      - name: Install Rust 1.100.0 LLVM tools
        id: endpoint_tools
        if: ${{ !cancelled() && steps.coverage_tools.outcome == 'success' }}
        run: bash .github/ci/capture.sh endpoint-coverage-setup rustup component add --toolchain 1.100.0 llvm-tools
      - name: Require 85 percent line coverage in each endpoint crate
        if: ${{ !cancelled() && steps.endpoint_tools.outcome == 'success' }}
        timeout-minutes: 20
        run: bash .github/ci/capture.sh endpoint-coverage bash .github/ci/assurance.sh endpoint-coverage
      - name: Retain coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-linux-x86_64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-evidence/
          if-no-files-found: error
          retention-days: 90

  fuzz:
    name: Unix component ASan fuzzing (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.100.0
        run: bash .github/ci/capture.sh rust-setup bash .github/ci/install.sh rust
      - name: Install pinned cargo-fuzz and nightly
        run: bash .github/ci/capture.sh fuzz-setup bash .github/ci/install.sh fuzz
      - name: Require the locked 250,000-input ASan campaign
        timeout-minutes: 10
        run: bash .github/ci/capture.sh fuzz bash .github/ci/fuzz.sh unix_component
      - name: Retain fuzz output and crash artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unix-component-fuzz-linux-x86_64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-evidence/
          if-no-files-found: error
          retention-days: 90

  journal-fuzz:
    name: Journal frame ASan fuzzing (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.100.0
        run: bash .github/ci/capture.sh rust-setup bash .github/ci/install.sh rust
      - name: Install pinned cargo-fuzz and nightly
        run: bash .github/ci/capture.sh journal-fuzz-setup bash .github/ci/install.sh fuzz
      - name: Require the locked 250,000-input ASan campaign
        timeout-minutes: 10
        run: bash .github/ci/capture.sh journal-fuzz bash .github/ci/fuzz.sh journal_frame
      - name: Retain journal fuzz output and crash artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journal-frame-fuzz-linux-x86_64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-evidence/
          if-no-files-found: error
          retention-days: 90

  mutation:
    name: Safety model mutation (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.100.0
        run: bash .github/ci/capture.sh rust-setup bash .github/ci/install.sh rust
      - name: Install cargo-mutants
        run: bash .github/ci/capture.sh mutation-setup bash .github/ci/install.sh mutation
      - name: Run scoped mutation campaign
        timeout-minutes: 30
        run: bash .github/ci/capture.sh mutation bash .github/ci/assurance.sh mutation
      - name: Retain mutation reports and controls
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-linux-x86_64-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-evidence/
          if-no-files-found: error
          retention-days: 90
