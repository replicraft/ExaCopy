name: Linux direct remote commissioning

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-remote-commissioning.yml'
      - '.github/ci/remote_commissioning*.py'
      - '.github/ci/remote_commissioning_digest_tool.sh'
      - '.github/ci/remote_retry_commissioning*.py'
      - 'apps/exacopy-cli/verification/remote/*.py'
      - 'apps/exacopy-cli/verification/remote/retry_sftp_peer.c'
      - 'apps/exacopy-cli/verification/remote/campaign-argv.json'
      - 'apps/exacopy-cli/src/**'
      - 'apps/exacopy-cli/Cargo.toml'
      - 'crates/adapters/exacopy-sftp/**'
      - 'crates/net/exacopy-ssh/**'
      - 'crates/net/exacopy-wireguard/**'
      - 'crates/platform/exacopy-platform/src/linux*'
      - 'crates/platform/exacopy-platform/src/linux/**'
      - 'crates/engines/exacopy-transfer/**'
      - 'crates/storage/exacopy-journal/**'
      - 'crates/interfaces/exacopy-endpoint/**'
      - 'crates/foundation/exacopy-core/**'
      - 'crates/foundation/exacopy-model/**'
      - 'specs/dependencies/**'
      - '.github/ci/capture.sh'
      - '.github/ci/install.sh'
      - '.cargo/config.toml'
      - 'tools/apfs_source.py'
      - 'tools/transport_source.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  CARGO_BUILD_JOBS: "2"
  EXPECTED_RUST_HOST: x86_64-unknown-linux-gnu

jobs:
  wireguard-provider:
    if: github.event_name == 'push' && github.repository == 'replicraft/ExaCopy' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact clean source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && test -z "$(git status --porcelain)"
      - name: Test read-only provider classification
        run: python3 -B -Werror .github/ci/remote_commissioning_wireguard_provider_test.py -v
      - name: Record existing kernel provider and tool observations
        run: python3 -B .github/ci/remote_commissioning_wireguard_provider.py
      - name: Retain bounded provider observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exacopy-wireguard-provider-${{ github.run_attempt }}
          path: ${{ runner.temp }}/exacopy-kernel-wireguard-provider/provider.json
          if-no-files-found: error
          retention-days: 30

  direct:
    name: ${{ matrix.campaign == 'direct' && 'direct' || 'direct READ timeout' }}
    strategy:
      fail-fast: false
      matrix:
        campaign: ${{ fromJSON(github.event_name == 'push' && '["direct","retry"]' || '["direct"]') }}
    env:
      COMMISSIONING_CAMPAIGN: ${{ matrix.campaign }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Admit only the canonical hosted synthetic fixture
        run: |
          evidence="$RUNNER_TEMP/exacopy-evidence"
          mkdir -p -- "$evidence"
          status=blocked
          if [[ "$GITHUB_SERVER_URL" == https://github.com &&
                "${GITHUB_REPOSITORY,,}" == replicraft/exacopy &&
                "$GITHUB_REF" == refs/heads/main &&
                ( "$GITHUB_EVENT_NAME" == push || "$GITHUB_EVENT_NAME" == workflow_dispatch ) &&
                "$GITHUB_ACTIONS" == true && "$RUNNER_ENVIRONMENT" == github-hosted &&
                "$RUNNER_OS" == Linux && "$RUNNER_ARCH" == X64 &&
                ! -v EXACOPY_REMOTE_DEPLOYMENT ]]; then
            status=admitted
          fi
          printf '%s\n' 'policy=hosted-synthetic-direct-v1' "status=$status" \
            "repository=$GITHUB_REPOSITORY" "event=$GITHUB_EVENT_NAME" "ref=$GITHUB_REF" \
            "sha=$GITHUB_SHA" "ref_protected=${GITHUB_REF_PROTECTED:-unknown}" \
            > "$evidence/commissioning-admission.log"
          test "$status" = admitted
          case "$COMMISSIONING_CAMPAIGN" in
            direct) ;;
            retry) test "$GITHUB_EVENT_NAME" = push ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        id: checkout
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact clean source
        run: test "$(git rev-parse HEAD)" = "$GITHUB_SHA" && test -z "$(git status --porcelain)"
      - name: Run portable commissioning controls
        run: |
          python3 -B .github/ci/remote_commissioning_test.py -v
          python3 -B apps/exacopy-cli/verification/remote/test_fixture.py -v
          if [[ "$COMMISSIONING_CAMPAIGN" == retry ]]; then
            python3 -B .github/ci/remote_retry_commissioning_test.py -v
            python3 -B apps/exacopy-cli/verification/remote/test_retry_campaign.py -v
          fi
      - name: Prepare pinned source and tools
        run: |
          bash .github/ci/capture.sh apfs-source python3 -B tools/apfs_source.py --fetch
          bash .github/ci/capture.sh transport-source python3 -B tools/transport_source.py --fetch
          bash .github/ci/capture.sh rust-setup bash .github/ci/install.sh rust
          bash .github/ci/capture.sh locked-fetch cargo +1.100.0 fetch --locked
      - name: Extract the independent digest tool from Ubuntu's signed package index
        run: bash .github/ci/remote_commissioning_digest_tool.sh stage
      - name: Commission the direct CLI with synthetic fixture authority
        run: |
          case "$COMMISSIONING_CAMPAIGN" in
            direct) python3 -B .github/ci/remote_commissioning.py ;;
            retry) python3 -B .github/ci/remote_retry_commissioning.py ;;
            *) exit 1 ;;
          esac
      - name: Remove the job-owned digest tool after confirmed fixture cleanup
        if: always() && steps.checkout.outcome == 'success'
        run: bash .github/ci/remote_commissioning_digest_tool.sh cleanup
      - name: Retain allowlisted commissioning observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: exacopy-${{ matrix.campaign }}-commissioning-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exacopy-evidence/
            ${{ runner.temp }}/exacopy-${{ matrix.campaign }}-commissioning/report/
          if-no-files-found: error
          retention-days: 90
