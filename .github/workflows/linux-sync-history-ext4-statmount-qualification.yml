name: Linux sync history ext4 statmount qualification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-sync-history-ext4-statmount-qualification.yml'
      - '.github/ci/common.sh'
      - '.github/ci/capture.sh'
      - '.github/ci/install.sh'
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/platform/exacopy-platform/Cargo.toml'
      - 'crates/platform/exacopy-platform/src/lib.rs'
      - 'crates/platform/exacopy-platform/src/linux.rs'
      - 'crates/platform/exacopy-platform/src/managed_sync_statmount.rs'
      - 'crates/platform/exacopy-platform/src/linux/process_crash.rs'
      - 'crates/platform/exacopy-platform/src/linux/handle.rs'
      - 'crates/platform/exacopy-platform/src/linux/mount_observation.rs'
      - 'crates/platform/exacopy-platform/src/linux/named_read.rs'
      - 'crates/platform/exacopy-platform/src/linux/source.rs'
      - 'crates/platform/exacopy-platform/src/linux/source/**'
      - 'crates/platform/exacopy-platform/src/linux/sync_preview.rs'
      - 'crates/platform/exacopy-platform/src/linux/sync_preview/**'
      - 'crates/platform/exacopy-platform/tests/linux_sync_history_ext4_statmount.rs'
      - 'crates/platform/exacopy-platform/verification/sync_history_ext4/run.py'
      - 'crates/platform/exacopy-platform/verification/sync_history_ext4_statmount/**'
      - 'crates/foundation/exacopy-core/src/component.rs'
      - 'crates/interfaces/exacopy-endpoint/src/linux_staging.rs'
      - 'crates/interfaces/exacopy-endpoint/src/positioned.rs'
      - 'crates/interfaces/exacopy-endpoint/src/read_view.rs'
      - 'specs/dependencies/**'
      - 'specs/verification/owners.toml'
      - 'tools/apfs_source.py'
      - 'tools/qualification/native_supervision.py'
      - 'tools/transport_source.py'
      - 'xtask/src/verification/native.rs'
      - 'xtask/src/verification/native/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  EXPECTED_RUST_HOST: x86_64-unknown-linux-gnu
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  qualify:
    if: github.repository == 'replicraft/ExaCopy' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm exact canonical hosted input
        id: admission
        run: |
          test "$GITHUB_SERVER_URL" = https://github.com
          test "${GITHUB_REPOSITORY,,}" = replicraft/exacopy
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          test "$EXPECTED_RUST_HOST" = x86_64-unknown-linux-gnu
          test "${GITHUB_WORKFLOW_REF,,}" = replicraft/exacopy/.github/workflows/linux-sync-history-ext4-statmount-qualification.yml@refs/heads/main
          verification=crates/platform/exacopy-platform/verification
          for file in "$verification/sync_history_ext4/run.py" \
            "$verification/sync_history_ext4_statmount/fixture.toml" \
            "$verification/sync_history_ext4_statmount/run.py" \
            "$verification/sync_history_ext4_statmount/test_runner.py"; do
            test -f "$file" && test ! -L "$file" || exit 1
          done
          head=$(git rev-parse HEAD)
          status=$(git status --porcelain)
          test "$head" = "$GITHUB_SHA"
          test -z "$status"
          (umask 077; mkdir -- "$RUNNER_TEMP/exacopy-evidence")
      - name: Validate portable evidence controls
        run: |
          bash .github/ci/capture.sh sync-statmount-controls python3 -B -Werror \
            crates/platform/exacopy-platform/verification/sync_history_ext4_statmount/test_runner.py -v
      - name: Prepare pinned build inputs
        run: |
          bash .github/ci/capture.sh sync-statmount-apfs python3 -B tools/apfs_source.py --fetch
          bash .github/ci/capture.sh sync-statmount-transport python3 -B tools/transport_source.py --fetch
          bash .github/ci/capture.sh sync-statmount-rust bash .github/ci/install.sh rust
          bash .github/ci/capture.sh sync-statmount-lock cargo +1.100.0 fetch --locked \
            --target "$EXPECTED_RUST_HOST"
      - name: Observe unmapped attributes on the held ext4 history mount
        id: native
        run: |
          bash .github/ci/capture.sh sync-statmount-native python3 -B -Werror \
            crates/platform/exacopy-platform/verification/sync_history_ext4_statmount/run.py --revision "$GITHUB_SHA"
      - name: Retain exact native evidence
        if: always() && steps.native.outputs.evidence_path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-sync-history-ext4-statmount-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.native.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90
      - name: Retain workflow capture logs
        if: always() && steps.admission.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-sync-history-ext4-statmount-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exacopy-evidence/sync-statmount-controls.log
            ${{ runner.temp }}/exacopy-evidence/sync-statmount-controls.txt
            ${{ runner.temp }}/exacopy-evidence/sync-statmount-apfs.log
            ${{ runner.temp }}/exacopy-evidence/sync-statmount-apfs.txt
            ${{ runner.temp }}/exacopy-evidence/sync-statmount-transport.log
            ${{ runner.temp }}/exacopy-evidence/sync-statmount-transport.txt
            ${{ runner.temp }}/exacopy-evidence/sync-statmount-rust.log
            ${{ runner.temp }}/exacopy-evidence/sync-statmount-rust.txt
            ${{ runner.temp }}/exacopy-evidence/sync-statmount-lock.log
            ${{ runner.temp }}/exacopy-evidence/sync-statmount-lock.txt
            ${{ runner.temp }}/exacopy-evidence/sync-statmount-native.log
            ${{ runner.temp }}/exacopy-evidence/sync-statmount-native.txt
          if-no-files-found: ignore
          retention-days: 90
