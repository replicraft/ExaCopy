name: Windows NTFS qualification

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-ntfs-qualification.yml'
      - '.github/ci/windows-ntfs*.ps1'
      - '.github/ci/windows-ntfs-custody.cs'
      - '.github/ci/install.sh'
      - '.github/ci/capture.sh'
      - 'tools/install/windows/paths.ps1'
      - 'tools/apfs_source.py'
      - 'tools/transport_source.py'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'crates/foundation/exacopy-model/**'
      - 'crates/interfaces/exacopy-endpoint/**'
      - 'crates/platform/exacopy-platform/Cargo.toml'
      - 'crates/platform/exacopy-platform/build.rs'
      - 'crates/platform/exacopy-platform/src/windows.rs'
      - 'crates/platform/exacopy-platform/src/windows/**'
  workflow_dispatch:
    inputs:
      qualification:
        description: Native capability to qualify
        type: choice
        options: [Read, Stage, Diff]
        default: Read
      include_symlink:
        description: Include cases requiring Windows symbolic link permission
        type: boolean
        default: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  EXPECTED_RUST_HOST: x86_64-pc-windows-msvc
  NTFS_QUALIFICATION: ${{ inputs.qualification || 'Stage' }}
  NTFS_SYMLINKS: ${{ github.event_name == 'push' || inputs.include_symlink }}

jobs:
  qualify:
    name: Held-directory ${{ inputs.qualification || 'Stage' }} (Windows x64 NTFS)
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Provision pinned Pomologie APFS checkout
        shell: bash
        run: |
          apfs_python=python3
          if [[ "$RUNNER_OS" == Windows ]]; then apfs_python=python; fi
          bash .github/ci/capture.sh apfs-source "$apfs_python" -B tools/apfs_source.py --fetch
          bash .github/ci/capture.sh transport-source "$apfs_python" -B tools/transport_source.py --fetch
      - name: Install Rust 1.100.0
        shell: bash
        run: bash .github/ci/capture.sh rust-setup bash .github/ci/install.sh rust
      - name: Reject dirty qualification inputs
        shell: pwsh
        run: |
          & ./.github/ci/windows-ntfs-tests.ps1 `
            -LocalNtfsRoot $env:USERPROFILE `
            -Mode $env:NTFS_QUALIFICATION `
            -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'exacopy-windows-ntfs-controls')
      - name: Verify synthetic Stage custody selectors
        if: ${{ env.NTFS_QUALIFICATION == 'Stage' }}
        shell: pwsh
        run: |
          & ./.github/ci/windows-ntfs-custody-controls.ps1 |
            Tee-Object -FilePath (Join-Path $env:RUNNER_TEMP 'exacopy-windows-ntfs-controls/stage-custody-selectors.log')
      - name: Run native fixed NTFS fixture
        shell: pwsh
        run: |
          # The runner's TEMP can be on a different filesystem. The wrapper verifies
          # the profile directory's actual drive type, format, and reparse ancestry.
          $includeSymlink = $env:NTFS_SYMLINKS -eq 'true'
          & ./.github/ci/windows-ntfs.ps1 `
            -Repository $env:GITHUB_WORKSPACE `
            -LocalNtfsRoot $env:USERPROFILE `
            -Mode $env:NTFS_QUALIFICATION `
            -IncludeSymlink:$includeSymlink `
            -EvidenceDirectory (Join-Path $env:RUNNER_TEMP 'exacopy-windows-ntfs')
      - name: Retain raw Windows evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-ntfs-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exacopy-evidence/
            ${{ runner.temp }}/exacopy-windows-ntfs/
            ${{ runner.temp }}/exacopy-windows-ntfs-controls/
          if-no-files-found: error
          retention-days: 90
