name: Linux managed sync production qualification
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/linux-managed-sync-production-qualification.yml'
      - '.github/ci/common.sh'
      - '.github/ci/capture.sh'
      - '.github/ci/install.sh'
      - '.cargo/config.toml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'rust-toolchain.toml'
      - 'apps/exacopy-cli/Cargo.toml'
      - 'apps/exacopy-cli/src/lib.rs'
      - 'apps/exacopy-cli/src/main.rs'
      - 'apps/exacopy-cli/src/command.rs'
      - 'apps/exacopy-cli/src/args.rs'
      - 'apps/exacopy-cli/src/args/parser.rs'
      - 'apps/exacopy-cli/src/args/parser/**'
      - 'apps/exacopy-cli/src/assembly.rs'
      - 'apps/exacopy-cli/src/assembly/linux.rs'
      - 'apps/exacopy-cli/src/assembly/linux/managed_sync.rs'
      - 'apps/exacopy-cli/src/assembly/linux/managed_sync/**'
      - 'apps/exacopy-cli/src/profile.rs'
      - 'apps/exacopy-cli/src/linux_path.rs'
      - 'apps/exacopy-cli/src/unix_path.rs'
      - 'apps/exacopy-cli/src/sync_preview.rs'
      - 'apps/exacopy-cli/src/sync_preview/**'
      - 'apps/exacopy-cli/tests/linux_managed_sync_production.rs'
      - 'apps/exacopy-cli/tests/managed_sync_production/**'
      - 'apps/exacopy-cli/verification/managed_sync_production/**'
      - 'crates/platform/exacopy-platform/Cargo.toml'
      - 'crates/platform/exacopy-platform/src/lib.rs'
      - 'crates/platform/exacopy-platform/src/linux.rs'
      - 'crates/platform/exacopy-platform/src/protected_snapshot.rs'
      - 'crates/platform/exacopy-platform/src/protected_snapshot/**'
      - 'crates/platform/exacopy-platform/src/managed_sync_statmount.rs'
      - 'crates/platform/exacopy-platform/src/linux/handle.rs'
      - 'crates/platform/exacopy-platform/src/linux/mount_observation.rs'
      - 'crates/platform/exacopy-platform/src/linux/named_read.rs'
      - 'crates/platform/exacopy-platform/src/linux/owner_seed.rs'
      - 'crates/platform/exacopy-platform/src/linux/owner_seed/**'
      - 'crates/platform/exacopy-platform/src/linux/source.rs'
      - 'crates/platform/exacopy-platform/src/linux/source/**'
      - 'crates/platform/exacopy-platform/src/linux/sync_preview.rs'
      - 'crates/platform/exacopy-platform/src/linux/sync_preview/**'
      - 'crates/platform/exacopy-platform/src/linux/sync_profile_store.rs'
      - 'crates/platform/exacopy-platform/src/linux/sync_profile_store/**'
      - 'crates/platform/exacopy-platform/verification/sync_history_ext4/run.py'
      - 'crates/engines/exacopy-transfer/Cargo.toml'
      - 'crates/engines/exacopy-transfer/src/lib.rs'
      - 'crates/engines/exacopy-transfer/src/linux.rs'
      - 'crates/engines/exacopy-transfer/src/linux/sync_preview.rs'
      - 'crates/engines/exacopy-transfer/src/linux/sync_preview/**'
      - 'crates/engines/exacopy-transfer/src/manifest.rs'
      - 'crates/engines/exacopy-transfer/src/public_plan.rs'
      - 'crates/engines/exacopy-transfer/src/sync_genesis.rs'
      - 'crates/engines/exacopy-transfer/src/sync_genesis/**'
      - 'crates/formats/exacopy-plan/src/lib.rs'
      - 'crates/formats/exacopy-plan/src/portable.rs'
      - 'crates/formats/exacopy-plan/Cargo.toml'
      - 'crates/formats/exacopy-plan/src/workflow_sync.rs'
      - 'crates/formats/exacopy-plan/src/workflow_sync/**'
      - 'crates/formats/exacopy-plan/src/cbor.rs'
      - 'crates/formats/exacopy-plan/src/cbor/**'
      - 'crates/formats/exacopy-manifest/src/lib.rs'
      - 'crates/formats/exacopy-manifest/src/portable.rs'
      - 'crates/formats/exacopy-manifest/Cargo.toml'
      - 'crates/formats/exacopy-manifest/src/sync_baseline.rs'
      - 'crates/formats/exacopy-manifest/src/sync_baseline/**'
      - 'crates/foundation/exacopy-core/src/component.rs'
      - 'crates/foundation/exacopy-model/src/lib.rs'
      - 'crates/foundation/exacopy-model/src/sync.rs'
      - 'crates/foundation/exacopy-model/src/sync_genesis.rs'
      - 'crates/interfaces/exacopy-endpoint/Cargo.toml'
      - 'crates/interfaces/exacopy-endpoint/src/lib.rs'
      - 'crates/interfaces/exacopy-endpoint/src/linux_staging.rs'
      - 'crates/interfaces/exacopy-endpoint/src/positioned.rs'
      - 'crates/interfaces/exacopy-endpoint/src/read_view.rs'
      - 'crates/storage/exacopy-content/src/stream.rs'
      - 'specs/dependencies/**'
      - 'specs/verification/owners.toml'
      - 'tools/apfs_source.py'
      - 'tools/qualification/native_supervision.py'
      - 'tools/transport_source.py'
      - 'xtask/src/verification/native.rs'
      - 'xtask/src/verification/native/**'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  EXPECTED_RUST_HOST: x86_64-unknown-linux-gnu
  CARGO_BUILD_JOBS: "2"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never

jobs:
  qualify:
    if: github.repository == 'replicraft/ExaCopy' && github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Confirm exact canonical hosted input
        id: admission
        run: |
          test "$GITHUB_SERVER_URL" = https://github.com
          test "${GITHUB_REPOSITORY,,}" = replicraft/exacopy
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_EVENT_NAME" = push
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          test "$EXPECTED_RUST_HOST" = x86_64-unknown-linux-gnu
          test "${GITHUB_WORKFLOW_REF,,}" = replicraft/exacopy/.github/workflows/linux-managed-sync-production-qualification.yml@refs/heads/main
          verification=apps/exacopy-cli/verification/managed_sync_production
          for file in crates/platform/exacopy-platform/verification/sync_history_ext4/run.py \
            "$verification/fixture.toml" "$verification/run.py" "$verification/test_runner.py"; do
            test -f "$file" && test ! -L "$file" || exit 1
          done
          head=$(git rev-parse HEAD)
          status=$(git status --porcelain)
          test "$head" = "$GITHUB_SHA"
          test -z "$status"
          (umask 077; mkdir -- "$RUNNER_TEMP/exacopy-evidence")
      - name: Validate portable evidence controls
        run: |
          bash .github/ci/capture.sh managed-sync-production-controls python3 -B -Werror \
            apps/exacopy-cli/verification/managed_sync_production/test_runner.py -v
      - name: Prepare pinned build inputs
        run: |
          bash .github/ci/capture.sh managed-sync-production-apfs python3 -B tools/apfs_source.py --fetch
          bash .github/ci/capture.sh managed-sync-production-transport python3 -B tools/transport_source.py --fetch
          bash .github/ci/capture.sh managed-sync-production-rust bash .github/ci/install.sh rust
          bash .github/ci/capture.sh managed-sync-production-lock cargo +1.100.0 fetch --locked \
            --target "$EXPECTED_RUST_HOST"
      - name: Qualify managed Init and read-only preview on native ext4
        id: native
        run: |
          bash .github/ci/capture.sh managed-sync-production-native python3 -B -Werror \
            apps/exacopy-cli/verification/managed_sync_production/run.py --revision "$GITHUB_SHA"
      - name: Retain exact native evidence
        if: always() && steps.native.outputs.evidence_path != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-managed-sync-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.native.outputs.evidence_path }}
          if-no-files-found: error
          retention-days: 90
      - name: Retain workflow capture logs
        if: always() && steps.admission.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-managed-sync-production-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/exacopy-evidence/managed-sync-production-controls.log
            ${{ runner.temp }}/exacopy-evidence/managed-sync-production-controls.txt
            ${{ runner.temp }}/exacopy-evidence/managed-sync-production-apfs.log
            ${{ runner.temp }}/exacopy-evidence/managed-sync-production-apfs.txt
            ${{ runner.temp }}/exacopy-evidence/managed-sync-production-transport.log
            ${{ runner.temp }}/exacopy-evidence/managed-sync-production-transport.txt
            ${{ runner.temp }}/exacopy-evidence/managed-sync-production-rust.log
            ${{ runner.temp }}/exacopy-evidence/managed-sync-production-rust.txt
            ${{ runner.temp }}/exacopy-evidence/managed-sync-production-lock.log
            ${{ runner.temp }}/exacopy-evidence/managed-sync-production-lock.txt
            ${{ runner.temp }}/exacopy-evidence/managed-sync-production-native.log
            ${{ runner.temp }}/exacopy-evidence/managed-sync-production-native.txt
          if-no-files-found: ignore
          retention-days: 90
